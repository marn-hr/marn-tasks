function xlDate(v){
  if(v===null||v===undefined||v==='') return '';
  if(typeof v==='number' && typeof XLSX!=='undefined'){ const d=XLSX.SSF.parse_date_code(v); if(d) return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`; }
  const s=String(v).trim(); let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return '';
}
const MONTHS={january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12};
function xlStamp(v){
  if(typeof v==='number' && typeof XLSX!=='undefined'){ const d=XLSX.SSF.parse_date_code(v); if(d) return new Date(d.y,d.m-1,d.d,d.H||0,d.M||0,Math.floor(d.S||0)).toISOString(); }
  const s=String(v||'').trim(); const m=s.match(/^(\d{1,2})\/([A-Za-z]+)\/(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?/i);
  if(m){ let h=+m[4]; const ap=(m[7]||'').toUpperCase(); if(ap==='PM'&&h<12) h+=12; if(ap==='AM'&&h===12) h=0; const mo=MONTHS[m[2].toLowerCase()]; if(mo) return new Date(+m[3],mo-1,+m[1],h,+m[5],+(m[6]||0)).toISOString(); }
  const d=new Date(s); return isNaN(d)? new Date().toISOString() : d.toISOString();
}
const nrm=(v)=> String(v??'').trim().toLowerCase();
function mapStatus(v){ const s=nrm(v); if(!s) return 'todo';
  for(const k of STATUSES){ if(nrm(T.en.st[k])===s || nrm(T.ar.st[k])===s || k===s) return k; }
  if(/done|complete|منجز/.test(s)) return 'done'; if(/stuck|block|متعثر/.test(s)) return 'stuck'; if(/working|progress|doing|قيد/.test(s)) return 'doing'; return 'todo'; }
function mapPriority(v){ const s=nrm(v); if(!s) return 'med'; if(/critical|high|urgent|عالي|حرج/.test(s)) return 'high'; if(/low|منخفض/.test(s)) return 'low'; return 'med'; }
function mapBoard(v){ const s=nrm(v); if(!s) return ''; const b=BOARDS.find(b=>[b.id,b.en,b.ar].some(z=>nrm(z)===s)); return b? b.id : ''; }
function mapFocus(v){ const s=nrm(v); if(!s) return ''; const f=FOCUS.find(f=>[f.id,f.en,f.ar].some(z=>nrm(z)===s)); return f? f.id : ''; }
function findMemberOne(n){ const s=nrm(n); for(const [id,m] of S.members.entries()){ if(nrm(m.name)===s) return id; } return null; }
function findMember(name){ const n=nrm(String(name||'').split(',')[0]); if(!n) return null; for(const [id,m] of S.members.entries()){ if(nrm(m.name)===n) return id; } return null; }
function parseWorkbook(wb){
  const sheets=wb.SheetNames.map(n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null,raw:true,blankrows:false}));
  // updates: a sheet whose header holds Item ID and Update Content
  const upd=new Map();
  for(const rows of sheets){
    const hi=rows.findIndex(r=>r && r.some(c=>nrm(c)==='item id') && r.some(c=>nrm(c)==='update content')); if(hi<0) continue;
    const hdr=rows[hi].map(nrm); const ci=(k)=>hdr.indexOf(k);
    const cId=ci('item id'), cUser=ci('user'), cAt=ci('created at'), cTx=ci('update content');
    for(const r of rows.slice(hi+1)){ if(!r) continue; const id=String(r[cId]??'').trim(), tx=String(r[cTx]??'').trim(); if(!id||!tx) continue;
      if(!upd.has(id)) upd.set(id,[]); upd.get(id).push({at:xlStamp(r[cAt]), by:findMember(r[cUser]), name:String(r[cUser]||'').trim(), text:tx.slice(0,2000)}); }
  }
  const tasks=[];
  for(const rows of sheets){
    if(rows.some(r=>r && r.some(c=>nrm(c)==='update content'))) continue;
    let col=null, group='', lastSingle='', sub=null, parent=null;
    for(const r of rows){
      if(!r) continue;
      const cells=r.map(c=> c===null? '' : c); const filled=cells.filter(c=>String(c).trim()!=='').length;
      const first=String(cells[0]??'').trim();
      if(nrm(first)==='name' && cells.some(c=>['owner','status','priority','impact','pillar','department'].includes(nrm(c)))){
        const h=cells.map(nrm); col={name:0, sub:h.indexOf('subitems'), owner:h.indexOf('owner'), pri:h.indexOf('priority'), st:h.indexOf('status'), due:h.findIndex(x=>x==='due date'||x==='date'||x==='due'), start:h.findIndex(x=>x==='start'||x==='start date'), id:h.findIndex(x=>x.startsWith('item id')), notes:h.findIndex(x=>x==='notes'), ref:h.findIndex(x=>x==='ref'||x==='reference'), titleEn:h.indexOf('name (english)'), dept:h.indexOf('department'), pillar:h.indexOf('pillar'), impact:h.indexOf('impact'), impactEn:h.indexOf('impact (english)')};
        group=lastSingle; sub=null; continue; }
      if(nrm(first)==='subitems' && cells.some(c=>nrm(c)==='name')){ const h=cells.map(nrm); sub={name:h.indexOf('name'), owner:h.indexOf('owner'), st:h.indexOf('status'), date:h.indexOf('date')}; continue; }
      if(!first){ if(sub && parent){ const nm=String(cells[sub.name]||'').trim(); if(nm){ const bits=[sub.st>=0&&cells[sub.st]?String(cells[sub.st]):'', sub.owner>=0&&cells[sub.owner]?String(cells[sub.owner]):'', sub.date>=0?xlDate(cells[sub.date]):''].filter(Boolean); parent.subs.push('• '+nm+(bits.length?` (${bits.join(', ')})`:'')); } } continue; }
      sub=null;
      if(filled===1){ lastSingle=first; continue; }
      if(!col) continue;
      const g=(i)=> i>=0? cells[i] : '';
      const srcId=String(g(col.id)||'').trim();
      parent={title:first.slice(0,200), owner:String(g(col.owner)||'').trim().slice(0,80), status:mapStatus(g(col.st)), priority:mapPriority(g(col.pri)), critical:/critical/i.test(String(g(col.pri)||'')),
        due:xlDate(g(col.due)), start:xlDate(g(col.start)), group:group.slice(0,60), ref:String(g(col.ref)||'').trim().slice(0,80), notes:String(g(col.notes)||'').trim(), srcId, subs:[], titleEn:String(g(col.titleEn)||'').trim().slice(0,200), dept:mapBoard(g(col.dept)), focus:mapFocus(g(col.pillar)), impact:String(g(col.impact)||'').trim().slice(0,1000), impactEn:String(g(col.impactEn)||'').trim().slice(0,1000)};
      tasks.push(parent);
    }
  }
  return {tasks, upd};
}
async function importFile(file){
  const board=S.board;
  if(S.view!=='board' || !board || (isLocked(board) && !keyOf(board))) return;
  if(typeof XLSX==='undefined'){ toast(t('importFail'), true); return; }
  let parsed;
  try{ const wb=XLSX.read(await file.arrayBuffer(), {type:'array'}); parsed=parseWorkbook(wb); }catch(e){ console.warn(e); toast(t('importFail'), true); return; }
  if(!parsed.tasks.length){ toast(t('importFail'), true); return; }
  toast(t('importing'));
  if(isAch(board)) parsed.tasks.forEach(p=>{ if(!p.srcId) p.srcId='T:'+nrm(p.titleEn||p.title); });
  const have=new Set(boardTasks(board).map(x=>x.srcId || (isAch(board)? 'T:'+nrm(x.titleEn||x.title) : '')).filter(Boolean));
  let n=0, k=0;
  for(const p of parsed.tasks){
    if(p.srcId && have.has(p.srcId)){ k++; continue; }
    const notes=[p.notes, p.critical? (L()==='ar'?'الأولوية في المصدر: حرجة':'Source priority: Critical') : '', p.subs.length? ((L()==='ar'?'المهام الفرعية:':'Subitems:')+'\n'+p.subs.join('\n')) : ''].filter(Boolean).join('\n\n').slice(0,4000);
    const updates=(parsed.upd.get(p.srcId)||[]).sort((a,b)=>a.at.localeCompare(b.at)).slice(-100);
    const tk={...blankTask(board), title:p.title, ...ownerFields(p.owner.split(',').map(v=>v.trim()).filter(Boolean).map(n=>({name:n, id:findMemberOne(n)}))), status:p.status, priority:p.priority, start:p.start, due:p.due, group:p.group, ref:p.ref, notes, updates};
    if(p.srcId) tk.srcId=p.srcId;
    if(p.focus) tk.focus=p.focus;
    if(isAch(board)) Object.assign(tk,{status:'done', owner:'', ownerId:null, ownerIds:[], due:'', start:'', titleEn:p.titleEn, dept:p.dept, impact:p.impact, impactEn:p.impactEn});
    const id=await saveTask(tk, hist('created')); if(id){ n++; if(p.srcId) have.add(p.srcId); }
  }
  toast(t('imported')(n,k)); render();
}

   Access is decided by the member lists in access/departments and enforced by firestore.rules.
   Each department keeps its own password, which encrypts its tasks and reports.
   The Chief Executive Officer opens every department without a password: when a member opens a
   department, its key is deposited in ceokeys/{department}, which only the CEO can read. */
function arN(n, one, two, few, many){ if(n===1) return one; if(n===2) return two; if(n>=3&&n<=10) return `${n} ${few}`; return `${n} ${many}`; }

};

const lc = (s)=> String(s||'').trim().toLowerCase();
const isCEO = ()=> !!S.me.isCEO;
const isAdmin = ()=> !!S.me.isOwner;
function memberOf(b){ return !!S.me.email && Array.isArray(S.mine) && S.mine.includes(b); }
/* Access model: memberships/{email} holds that person's departments and is readable only by that person and the
   administrators; access/departments (the full lists and their change log) is readable only by the administrators. */
function startAccess(){
  const db=S.db, email=lc(S.me.email);
  if(!email){ S.mine=[]; S.accessLoaded=true; render(); return; }
  db.doc('memberships/'+email).onSnapshot(snap=>{ const d=snap.exists? snap.data(): null; S.mine = d && Array.isArray(d.depts) ? d.depts : []; S.myLeads = d && Array.isArray(d.leads) ? d.leads : []; S.accessLoaded=true; resubscribe(); render(); },
    err=>{ console.warn('membership', err); S.mine=[]; S.myLeads=[]; S.accessLoaded=true; resubscribe(); render(); });
  if(isAdmin()) db.doc('access/departments').onSnapshot(snap=>{ S.access = snap.exists? snap.data(): null; if(S.access && !S.access.mirrored) mirrorAccess(S.access, accLists(null)); render(); },
    err=> console.warn('access', err));
}
// write each person's membership record from the lists; people dropped from every list get an empty record
let mirroring=false;
async function mirrorAccess(lists, before){
  if(mirroring) return true; mirroring=true;
  try{ return await mirrorRun(lists, before); } finally { mirroring=false; }
}
async function mirrorRun(lists, before){
  const now=new Date().toISOString(), by=lc(S.me.email), emails=new Set();
  for(const id of DEPT_IDS){ (lists[id]||[]).forEach(e=>emails.add(lc(e))); (before[id]||[]).forEach(e=>emails.add(lc(e))); }
  let ok=true;
  const leads=(lists && lists.leads) || {};
  for(const e of emails){ const depts=DEPT_IDS.filter(id=>(lists[id]||[]).map(lc).includes(e)); const ld=depts.filter(id=>(leads[id]||[]).map(lc).includes(e)); try{ await S.db.doc('memberships/'+e).set({email:e, depts, leads:ld, updatedAt:now, updatedBy:by}); }catch(err){ ok=false; console.warn('mirror', e, err); } }
  if(ok){ try{ await S.db.doc('access/departments').update({mirrored:true}); }catch(err){ console.warn('mirror flag', err); } }
  return ok;
}
function canSee(b){ return DEPT_IDS.includes(b) && (isCEO() || memberOf(b)); }
function myBoards(){ return BOARDS.filter(b=>canSee(b.id)); }
function hasAnyAccess(){ return isCEO() || myBoards().length>0; }
function defaultBoard(){ if(S.view==='board' && canSee(S.board)) return S.board; const mb=myBoards(); return (mb.find(b=>keyOf(b.id))||mb[0]||BOARDS[0]).id; }
function setHash(){ try{ history.replaceState(null,'', '#'+(S.view==='board'? S.board+'/'+S.section : S.view)); }catch(e){} }

/* periods: the Saudi working week starts on Sunday; the monthly report covers the month just ended */
function weekStart(iso){ const d=parseISO(iso)||new Date(); return toISO(addDays(d, -d.getDay())); }
function reportingMonth(){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); return toISO(d).slice(0,7); }
function periodLabel(kind, p){
  if(!p) return '';
  if(kind==='monthly'){ const [y,m]=String(p).split('-').map(Number); if(!y||!m) return p; try{ return new Intl.DateTimeFormat(t('dateFmt'),{month:'long',year:'numeric'}).format(new Date(y,m-1,1)); }catch(e){ return p; } }
  return fmtDate(p);
}
function reportsOf(b, kind){ return [...S.reports.values()].filter(r=>r.board===b && r.kind===kind).sort((x,y)=> String(y.period||'').localeCompare(String(x.period||'')) || String(y.createdAt||'').localeCompare(String(x.createdAt||''))); }
function weeklyThisWeek(b){ const ws=weekStart(todayISO()); return reportsOf(b,'weekly').find(r=> r.period && weekStart(r.period)===ws) || null; }
function monthlyFor(b, ym){ return reportsOf(b,'monthly').find(r=> r.period===ym) || null; }
function doneInMonth(x, ym){ return x.status==='done' && (x.history||[]).some(h=>h.what==='status' && h.to==='done' && String(h.at||'').slice(0,7)===ym); }
function monthSnapshot(b, ym){
  const l=boardTasks(b).filter(x=>!x.locked);
  return { created:l.filter(x=>String(x.createdAt||'').slice(0,7)===ym).length, done:l.filter(x=>doneInMonth(x,ym)).length, open:l.filter(x=>x.status!=='done').length, overdue:l.filter(isOverdue).length };
}

/* ---------- subscriptions per department ---------- */
const SUBS = new Map(); const rawByBoard = new Map(); const rawRepByBoard = new Map(); let membersSub = null;
function resubscribe(){
  const db=S.db; if(!db) return;
  if(!membersSub && (hasAnyAccess() || isAdmin())){
    membersSub = db.collection('members').onSnapshot(snap=>{ S.members=new Map(); snap.docs.forEach(d=>{ if(d.exists) S.members.set(d.id, d.data()); }); render(); }, err=>{ console.warn('members', err); membersSub=null; });
  }
  const want = new Map(myBoards().map(b=>[b.id, memberOf(b.id)?'m':'c']));
  let changed=false;
  for(const [b,sub] of [...SUBS]){
    if(want.get(b)===sub.tag) continue;
    sub.uns.forEach(u=>{ try{ u&&u(); }catch(e){} }); SUBS.delete(b); changed=true;
    if(!want.has(b)){ rawByBoard.delete(b); rawRepByBoard.delete(b); rawItemsByBoard.delete(b); S.logs.delete(b); delete S.keys[b]; forgetKey(b); }
  }
  for(const [b,tag] of want){
    if(SUBS.has(b)) continue;
    const uns=[];
    uns.push(db.collection('tasks').where('board','==',b).onSnapshot(snap=> ingestBoard(b, snap), err=>{ console.warn('tasks', b, err); if(!retrySub(b)){ rawByBoard.set(b, new Map()); S.tasksLoaded=true; S.connecting=false; render(); } }));
    uns.push(db.collection('reports').where('board','==',b).onSnapshot(snap=> ingestReports(b, snap), err=>{ console.warn('reports', b, err); retrySub(b); }));
    if(DEPT_FEATURES[b]) uns.push(db.collection('items').where('board','==',b).onSnapshot(snap=> ingestItems(b, snap), err=>{ console.warn('items', b, err); retrySub(b); }));
    if(tag==='m') uns.push(db.doc('settings/'+b).onSnapshot(snap=>{ S.lockSettings[b] = snap.exists? snap.data(): null; S.lockLoaded[b]=true; render(); }, err=>{ console.warn('settings', b, err); S.lockLoaded[b]=true; render(); }));
    else S.lockLoaded[b]=true;
    uns.push(db.collection('deptlogs/'+b+'/items').recent('at', 300).onSnapshot(snap=>{ S.logs.set(b, snap.docs.filter(d=>d.exists).map(d=>({id:d.id, ...d.data()}))); render(); }, err=> console.warn('log', b, err)));
    if(isCEO() && tag==='c') uns.push(db.doc('ceokeys/'+b).onSnapshot(async snap=>{
      const d = snap.exists? snap.data(): null;
      if(d && d.k){ try{ S.keys[b] = await crypto.subtle.importKey('raw', unb64(d.k), {name:'AES-GCM', length:256}, true, ['encrypt','decrypt']); await rebuildAll(); }catch(e){ console.warn('ceokey', e); } }
      S.ceoKeyLoaded[b]=true; S.mainKey=''; render();
    }, err=>{ console.warn('ceokey', b, err); S.ceoKeyLoaded[b]=true; render(); }));
    SUBS.set(b, {tag, uns}); changed=true;
  }
  if(changed){ rebuildRaw(); rebuildAll().then(()=>render()); }
  if(!want.size){ S.tasksLoaded=true; S.connecting=false; }
}
// Just after a member list changes, the rules can briefly still see the old list; retry a few times before giving up.
const subRetries = new Map();
function retrySub(b){
  const n=subRetries.get(b)||0; if(n>=4) return false; subRetries.set(b, n+1);
  const sub=SUBS.get(b); if(sub){ sub.uns.forEach(u=>{ try{ u&&u(); }catch(e){} }); SUBS.delete(b); }
  setTimeout(()=> resubscribe(), 1500*(n+1)); return true;
}
async function ingestBoard(b, snap){ subRetries.delete(b); const m=new Map(); snap.docs.forEach(d=>{ if(d.exists) m.set(d.id, d.data()); }); rawByBoard.set(b, m); rebuildRaw(); await rebuildAll(); S.tasksLoaded=true; S.connecting=false; await render(); }
function rebuildRaw(){ const out=new Map(); for(const [b,m] of rawByBoard){ if(!SUBS.has(b)) continue; for(const [id,d] of m) out.set(id, d); } rawDocs=out; }
async function ingestReports(b, snap){ const m=new Map(); snap.docs.forEach(d=>{ if(d.exists) m.set(d.id, d.data()); }); rawRepByBoard.set(b, m); await rebuildReports(); render(); }
async function repFromStored(id, data){ const r={id, ...data, c:{}}; if(data.enc){ const key=keyOf(data.board); if(key){ try{ r.c=await decryptObj(data.enc, key); }catch(e){ r.locked=true; } } else r.locked=true; } delete r.enc; return r; }
async function rebuildReports(){ const out=new Map(); for(const [b,m] of rawRepByBoard){ if(!SUBS.has(b)) continue; for(const [id,d] of m) out.set(id, await repFromStored(id, d)); } S.reports=out; }
async function rebuildAll(){ await rebuildTasks(); await rebuildReports(); await rebuildItems(); }

/* ---------- keys ---------- */
async function syncCeoKey(b){
  if(!memberOf(b) || !S.keys[b]) return;
  try{ const raw=await crypto.subtle.exportKey('raw', S.keys[b]); await S.db.doc('ceokeys/'+b).set({k:b64(raw), board:b, setAt:new Date().toISOString(), setBy:lc(S.me.email)}); }catch(e){ console.warn('ceokey', e); }
}
// tasks written before the department had a password are encrypted the first time a member opens it
async function sealPlain(b){
  if(!keyOf(b)) return;
  for(const [id,d] of [...rawDocs.entries()]){
    if(d.board!==b || d.enc) continue; const tk=S.tasks.get(id); if(!tk || tk.locked) continue;
    try{ const stored=await toStored(tk); rawDocs.set(id, stored); await queued(id, ()=> S.db.collection('tasks').doc(id).set(stored)); }catch(e){ console.warn('seal', e); }
  }
}

/* ---------- activity log (append only) ---------- */
const logGate = new Map();
async function logEvent(b, action, extra, gateKey){
  if(!S.db || !DEPT_IDS.includes(b) || !S.me.email || !canSee(b)) return;
  if(gateKey){ const k=b+'|'+gateKey, last=logGate.get(k)||0; if(Date.now()-last < 10*60*1000) return; logGate.set(k, Date.now()); }
  const rec={board:b, at:new Date().toISOString(), by:S.me.id||null, email:lc(S.me.email), name:myName()||'', action, ...(extra||{})};
  try{ await S.db.collection('deptlogs/'+b+'/items').add(rec); }catch(e){ console.warn('log', e); }
}
function logTaskChange(tk, h){
  const w=h&&h.what; if(!w) return;
  if(w==='created') logEvent(tk.board,'task.create',{ref:tk.id});
  else if(w==='status') logEvent(tk.board,'task.status',{ref:tk.id, to:h.to});
  else logEvent(tk.board,'task.edit',{ref:tk.id},'edit:'+tk.id);
}
function logText(e){
  const g=t('lg'), f=g[e.action];
  if(typeof f!=='function') return f || e.action || '';
  if(e.action==='task.status') return f(t('st')[e.to]||e.to||'');
  if(e.action==='tasks.fromMeeting') return f(e.n||0);
  if(/^(faq|process|issue|kb)\./.test(e.action||'')) return f(e['label_'+L()]||e.label||'', e);
  return f((t('kindName')||{})[e.kind]||'', periodLabel(e.kind, e.period));
}
function logListHTML(items, showDept){
  if(!items.length) return `<div class="empty"><b>${esc(t('emptyLog'))}</b></div>`;
  let h=`<div class="list loglist">`;
  for(const e of items){
    const mine = e.email && lc(e.email)===lc(S.me.email);
    const who = mine ? t('you') : (e.name || e.email || t('someone'));
    const act = e.ref && S.tasks.has(e.ref) ? ` data-action="open" data-id="${esc(e.ref)}"` : (e.rep && S.reports.has(e.rep) ? ` data-action="rep-open" data-id="${esc(e.rep)}"` : '');
    h+=`<div class="li"${act}><span class="when" title="${esc(fmtDateTime(e.at))}">${esc(fmtRel(e.at))}</span><div class="what"><div class="t">${esc(who)}</div><div class="d">${esc(logText(e))}${e.email && !mine?` · <span class="em">${esc(e.email)}</span>`:''}</div></div>${showDept?`<span class="where">${esc(boardName(e.board))}</span>`:''}</div>`;
  }
  return h+`</div>`;
}

/* ---------- department page: sections ---------- */
function secTabsHTML(){

function refreshSecCounts(){
  const b=S.board; if(S.view!=='board' || !b) return;
  const n={weekly:reportsOf(b,'weekly').length, monthly:reportsOf(b,'monthly').length, tasks:boardTasks(b).filter(x=>x.status!=='done').length, faq:itemsOf(b,'faq','published').length, process:itemsOf(b,'process','published').length, issue:itemsOf(b,'issue').filter(issActive).length};

function deptHeadHTML(){

function renderDeptBody(){
  const body=$('#body'); if(!body) return; const b=S.board;
  if(S.section==='log') body.innerHTML = logListHTML(S.logs.get(b)||[], false);
  else if(S.section==='faq') body.innerHTML = faqBodyHTML();
  else if(S.section==='process') body.innerHTML = procBodyHTML();
  else if(S.section==='issue') body.innerHTML = issBodyHTML();
  else body.innerHTML = reportListHTML(b, S.section);
}
function rsChip(r){ const st=r? (r.status==='final'?'final':'draft') : 'missing'; return `<span class="rs s-${st}">${esc(t('rs')[st])}</span>`; }
function reportListHTML(b, kind){
  const list=reportsOf(b, kind), ro=!canWrite(); let h='';
  const due = kind==='weekly' ? !weeklyThisWeek(b) : !monthlyFor(b, reportingMonth());
  if(due && !ro) h+=`<div class="callout"><span class="dot"></span><span>${esc(kind==='weekly'? t('weekDue') : t('monthDue')(periodLabel('monthly', reportingMonth())))}</span><button class="btn primary" data-action="rep-new" data-kind="${kind}" type="button">${esc(t('writeNow'))}</button></div>`;
  if(!list.length) return h+`<div class="empty"><b>${esc(kind==='weekly'?t('emptyWeekly'):t('emptyMonthly'))}</b>${esc(kind==='weekly'?t('emptyWeeklyHint'):t('emptyMonthlyHint'))}</div>`;
  h+=`<div class="replist">`;
  for(const r of list){
    const c=r.c||{}; let meta=[];
    if(r.locked) meta=[t('lockedTask')];
    else if(kind==='weekly'){
      const dn=(c.decisions||[]).filter(x=>String(x||'').trim()).length;
      const acts=(c.actions||[]).filter(a=>a && String(a.text||'').trim());
      const open=acts.filter(a=>{ const tk=a.taskId && S.tasks.get(a.taskId); return !tk || tk.status!=='done'; }).length;
      if(c.chair) meta.push(`${t('fChair')}: ${c.chair}`);
      meta.push(t('decisionsN')(dn)); meta.push(t('actionsN')(acts.length) + (acts.length? ` (${t('openN')(open)})` : ''));
    } else {
      const k=(c.kpis||[]).filter(x=>x && String(x.name||'').trim()); const cnt={on:0,risk:0,off:0}; k.forEach(x=>{ cnt[x.rag||'on']=(cnt[x.rag||'on']||0)+1; });
      meta.push(t('kpisN')(k.length)); if(k.length) meta.push(`${t('rag').on} ${cnt.on} · ${t('rag').risk} ${cnt.risk} · ${t('rag').off} ${cnt.off}`);
    }
    const who = nameOf(r.updatedBy) || r.createdName || '';
    h+=`<button type="button" class="rep" data-action="rep-open" data-id="${esc(r.id)}"><span class="rp num">${esc(periodLabel(kind, r.period))}</span><span class="rm">${esc(meta.join(' · '))}</span>${rsChip(r)}<span class="ru">${esc(who)}${who?' · ':''}${esc(fmtRel(r.updatedAt))}</span></button>`;
  }
  return h+`</div>`;
}

/* ---------- report editor ---------- */
function newReport(kind){
  const b=S.board; if(!keyOf(b) || !canWrite()) return;
  const c = kind==='weekly'
    ? {chair:myName()||'', attendees:'', agenda:'', decisions:[''], actions:[{text:'',owner:'',due:''}], risks:'', next:toISO(addDays(new Date(),7))}
    : {summary:'', kpis:[{name:'',target:'',actual:'',rag:'on'}], achievements:'', issues:'', support:'', priorities:''};
  S.section=kind; S.report={key:'new'+Date.now(), id:null, board:b, kind, period: kind==='weekly'? todayISO() : reportingMonth(), status:'draft', c, dirty:true, confirm:false, leave:false};
  setHash(); renderMain(true); $('#main').scrollTop=0;

async function saveReport(R){
  const key=keyOf(R.board); if(!key){ toast(t('saveFail'), true); return null; }
  const now=new Date().toISOString(), id=R.id || S.db.collection('reports').doc().id, prev=S.reports.get(id)||{};
  const stored={ board:R.board, kind:R.kind, period:R.period||'', status:R.status==='final'?'final':'draft',
    createdAt:prev.createdAt||now, createdBy:prev.createdBy||S.me.id||null, createdName:prev.createdName||myName()||'',
    updatedAt:now, updatedBy:S.me.id||null, finalAt: R.status==='final' ? (prev.finalAt||now) : null,
    enc: await encryptObj(R.c||{}, key) };
  try{ await S.db.collection('reports').doc(id).set(stored); }catch(e){ console.warn(e); toast(t('saveFail'), true); return null; }
  const {enc, ...plain}=stored; S.reports.set(id, {id, ...plain, c:JSON.parse(JSON.stringify(R.c||{}))});
  return id;
}
async function commitReport(status, reopen){
  const R=S.report; if(!R) return;
  if(!R.period){ toast(t('needPeriod'), true); $('#r-period')?.focus(); return; }
  const wasNew=!R.id, prev=R.status;
  if(status==='final'){
    if(R.kind==='monthly') R.c.snapshot = monthSnapshot(R.board, R.period);
    if(R.kind==='monthly' && feat(R.board,'issue')) R.c.issueStats = issueMonthStats(R.board, R.period);
    if(R.kind==='weekly' && feat(R.board,'issue')) R.c.issues = meetingIssues(R.board).map(x=>({code:x.code||'', title:x.c.title||'', severity:x.severity||'', status:x.status||'', due:x.dueAt||''}));
    if(R.c.decisions) R.c.decisions=R.c.decisions.filter(x=>String(x||'').trim());
    if(R.c.actions) R.c.actions=R.c.actions.filter(a=>a && (String(a.text||'').trim() || a.taskId));
    if(R.c.kpis) R.c.kpis=R.c.kpis.filter(k=>k && String(k.name||'').trim());
  }
  if(reopen){ delete R.c.snapshot; delete R.c.issueStats; delete R.c.issues; }
  R.status=status;
  const id=await saveReport(R); if(!id){ R.status=prev; return; }
  R.id=id; R.dirty=false; R.confirm=false; R.leave=false; R.key=id+'|'+Date.now();
  logEvent(R.board, reopen? 'report.reopen' : status==='final' ? 'report.final' : wasNew ? 'report.create' : 'report.save', {kind:R.kind, period:R.period, rep:id});
  toast(t(status==='final'?'repFinal':'repSaved'));
  renderMain(true); renderRail();
}
async function sendActions(){
  const R=S.report; if(!R || R.status==='final') return; const b=R.board; let n=0; const date=fmtDate(R.period);
  for(const a of (R.c.actions||[])){
    if(!a || a.taskId || !String(a.text||'').trim()) continue;
    const owners=String(a.owner||'').split(',').map(s=>s.trim()).filter(Boolean).map(nm=>({id:findMemberOne(nm), name:nm}));
    const task={...blankTask(b), title:String(a.text).trim().slice(0,200), due:a.due||'', group:t('meetingGroup')(date), ref:'WM-'+R.period, notes:t('fromMeeting')(date), ...ownerFields(owners)};
    const id=await saveTask(task, hist('created')); if(id){ a.taskId=id; n++; }
  }
  if(!n) return;
  await commitReport('draft');
  logEvent(b,'tasks.fromMeeting',{n, rep:R.id, kind:'weekly', period:R.period});
  toast(t('sentActions')(n));
}
async function removeReport(){
  const R=S.report; if(!R || !R.id) return;
  try{ await S.db.collection('reports').doc(R.id).delete(); }catch(e){ toast(t('saveFail'), true); return; }
  logEvent(R.board,'report.delete',{kind:R.kind, period:R.period});
  S.reports.delete(R.id); S.report=null; S.mainKey=''; toast(t('repDeleted')); render();
}

function procValidate(p){
  const errs=[]; const steps=(p.steps||[]);
  if(!String(p.name_ar||'').trim() && !String(p.name_en||'').trim()) errs.push(t('procErrName'));
  const ids=steps.map(s=>String(s.id||'').trim());
  if(steps.length<2) errs.push(t('procErrSteps'));
  if(ids.some(i=>!i)) errs.push(t('procErrId'));
  const dup=ids.filter((v,i)=>v && ids.indexOf(v)!==i); if(dup.length) errs.push(t('procErrDup')(dup[0]));
  if(!steps.some(s=>s.shape==='Start')) errs.push(t('procErrStart'));
  if(!steps.some(s=>s.shape==='End')) errs.push(t('procErrEnd'));
  for(const s of steps){ const nx=(s.next||[]).map(v=>String(v).trim()).filter(Boolean);
    for(const n of nx) if(!ids.includes(n)){ errs.push(t('procErrNext')(s.id, n)); break; }
    if(s.shape==='Decision'){ const la=(s.labels_ar||[]).filter(v=>String(v).trim()), le=(s.labels_en||[]).filter(v=>String(v).trim());
      if(nx.length<2) errs.push(t('procErrDecision')(s.id)); else if(Math.max(la.length, le.length)<nx.length) errs.push(t('procErrLabels')(s.id)); } }
  return errs;
}

/* The swimlane chart. Shape of the content: a path through several functions, so one lane per function (ordered as they
   first appear, right to left in Arabic), one row per step in the order written, phases as bands, decisions as branches;
   later branches leave from the side, loops back run in an outer channel. */
function procChartSVG(p, langOpt){
  const lang=langOpt||L(), rtl=lang==='ar';
  const tx=(o,k)=> String((lang==='en' ? (o[k+'_en'] || o[k+'_ar']) : (o[k+'_ar'] || o[k+'_en'])) || '');
  const steps=(p.steps||[]).filter(s=>s && String(s.id||'').trim());
  if(!steps.length) return `<div class="empty"><b>${esc(t('procNoSteps'))}</b></div>`;
  const ids=steps.map(s=>String(s.id).trim()), rowOf=new Map(ids.map((id,i)=>[id,i]));
  const lanes=[], laneIdx=steps.map(s=>{ const f=tx(s,'function').trim()||t('procNoFunction'); let i=lanes.indexOf(f); if(i<0){ lanes.push(f); i=lanes.length-1; } return i; });
  const hasPhase=steps.some(s=>tx(s,'phase').trim());
  const LW=236, NW=200, GAP=40, HEAD=48, PH=hasPhase?136:0;
  const edges=[];
  steps.forEach((s,i)=>{ if((s.shape||'Process')==='End') return;
    let nx=(Array.isArray(s.next)? s.next : []).map(v=>String(v).trim()).filter(Boolean);
    if(!nx.length && i+1<steps.length) nx=[ids[i+1]];
    const la=(s.labels_ar||[]), le=(s.labels_en||[]);
    nx.forEach((to,k)=>{ if(rowOf.has(to)) edges.push({from:i, to:rowOf.get(to), k, label:String((lang==='en'? (le[k]||la[k]) : (la[k]||le[k]))||'').trim()}); }); });
  const back=edges.filter(e=>e.to<=e.from); back.forEach((e,j)=>{ e.ch=j; });
  const CW = back.length ? 30 + back.length*12 : 14;
  const W = PH + lanes.length*LW + CW;
  const laneX=(i)=> rtl ? (W - PH - (i+1)*LW) : (PH + i*LW);
  const cpl=28, lines=(s)=> Math.min(16, Math.max(1, Math.ceil((tx(s,'text').length + String(s.id).length + 2)/cpl)));
  const hOf=(s)=>{ const sh=s.shape||'Process', base=20+lines(s)*16; return (sh==='Start'||sh==='End')? Math.max(42, base) : sh==='Decision'? Math.max(62, base+14) : sh==='Document'? Math.max(58, base+10) : Math.max(54, base); };
  const ys=[]; let y=HEAD+20;
  steps.forEach((s,i)=>{ if(i>0) y+= GAP + (hasPhase && tx(steps[i-1],'phase')!==tx(s,'phase') ? 16 : 0); ys.push(y); y+=hOf(s); });
  const H=y+28;
  const N=steps.map((s,i)=>{ const h=hOf(s), cx=laneX(laneIdx[i])+LW/2; return {x:cx-NW/2, y:ys[i], w:NW, h, cx, cy:ys[i]+h/2, b:ys[i]+h, s}; });
  const mid='ah'+Math.random().toString(36).slice(2,8);
  let svg=`<svg class="proc" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(tx(p,'name'))}" xmlns="http://www.w3.org/2000/svg"><defs><marker id="${mid}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ahd"/></marker></defs>`;
  lanes.forEach((name,i)=>{ const x=laneX(i); svg+=`<rect class="lane ${i%2?'alt':''}" x="${x}" y="0" width="${LW}" height="${H}"/><rect class="lanehead" x="${x+5}" y="6" width="${LW-10}" height="${HEAD-12}" rx="8"/>`+fo(x+10, 6, LW-20, HEAD-12, `<div class="lh">${esc(name)}</div>`, rtl); });
  if(hasPhase){ let start=0;
    for(let i=1;i<=steps.length;i++){ if(i===steps.length || tx(steps[i],'phase')!==tx(steps[start],'phase')){
      const top = start===0 ? HEAD+4 : (N[start-1].b + ys[start])/2, bot = i===steps.length ? H-6 : (N[i-1].b + ys[i])/2;
      const px = rtl ? W-PH+5 : 5, ph=tx(steps[start],'phase');
      if(ph) svg+=`<rect class="phband" x="${px}" y="${top+4}" width="${PH-10}" height="${Math.max(0,bot-top-8)}" rx="8"/>`+fo(px+3, top+4, PH-16, Math.max(0,bot-top-8), `<div class="ph">${esc(ph)}</div>`, rtl);
      if(i<steps.length) svg+=`<line class="phsep" x1="${rtl?CW:PH}" x2="${rtl?W-PH:W-CW}" y1="${bot}" y2="${bot}"/>`;
      start=i; } } }
  /* gutters: four tracks on each side of a lane; a line takes the first track that is free over its vertical span. Lines that leave
     the same step or reach the same step may share a track, so they read as one line that splits or joins. */
  const tracks=new Map(), span=(y1,y2,e)=>({lo:Math.min(y1,y2)-6, hi:Math.max(y1,y2)+6, from:e.from, to:e.to});
  const clear=(iv,sp)=> iv.every(o=> sp.hi<o.lo || sp.lo>o.hi || o.from===sp.from || o.to===sp.to);
  const gutterFree=(lane, side, y1, y2, e)=>{ const T=tracks.get(lane+':'+side); return !T || clear(T[0], span(y1,y2,e)); };
  const gutterX=(lane, side, y1, y2, e)=>{ const key=lane+':'+side; if(!tracks.has(key)) tracks.set(key, [[],[],[],[]]); const T=tracks.get(key), sp=span(y1,y2,e);
    let k=T.findIndex(iv=> clear(iv, sp)); if(k<0) k=T.length-1; T[k].push(sp); const off=5+k*4; return side<0 ? laneX(lane)+off : laneX(lane)+LW-off; };

  outs.forEach((list, from)=>{ const a=N[from], fw=list.filter(x=>!x.back);
    if(!isDec(a)){ fw.forEach(x=>{ x.side=0; }); }
    else { const down = fw.find(x=> x.same && !blocked(laneIdx[x.to], from, x.to)) || fw[0];

        else if(!same && !blocked(laneIdx[e.from], e.from, e.to)){ const yt=bN.y-GAP/2+3; d=`M${a.cx} ${a.b} V${yt} H${bN.cx} V${bN.y}`; arrive=a.cx; }

    if(sh==='Decision'){ const k=14; shape=`<polygon class="nd dec" points="${n.x+k},${n.y} ${n.x+n.w-k},${n.y} ${n.x+n.w},${n.cy} ${n.x+n.w-k},${n.b} ${n.x+k},${n.b} ${n.x},${n.cy}"/>`; }

    else if(sh==='Subprocess') shape=`<rect class="nd" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="6"/><line class="ndl" x1="${n.x+10}" x2="${n.x+10}" y1="${n.y}" y2="${n.b}"/><line class="ndl" x1="${n.x+n.w-10}" x2="${n.x+n.w-10}" y1="${n.y}" y2="${n.b}"/>`;

  return svg+labels+`</svg>`;
}

async function issSave(silent){
  const E=S.edit, b=S.board, m=E.draft.meta, c=E.draft.c;
  if(!String(c.title||'').trim()){ toast(t('issNeedTitle'), true); $('#if-title')?.focus(); return false; }
  const isNew=!E.id; if(isNew && !m.code) m.code=nextIssueCode(b);
  m.occ=(c.occ||[]).length; if(m.occ>=2) m.recurring=true;
  const prev=E.id? S.items.get(E.id) : null;
  const meta={severity:m.severity, openedAt:m.openedAt, dueAt:m.dueAt||'', dueManual:!!m.dueManual, withDept:!!m.withDept, recurring:!!m.recurring, occ:m.occ, code:m.code, closedAt: m.status==='closed' ? (m.closedAt||new Date().toISOString()) : ''};
  const id=await saveItem({id:E.id, board:b, kind:'issue', status:m.status, meta, c});
  if(!id) return false;
  if(isNew) logEvent(b,'issue.create',{label:m.code, label_ar:m.code});
  else if(prev && prev.status!==m.status) logEvent(b, m.status==='closed'?'issue.close':'issue.status', {label:m.code, label_ar:m.code, to:m.status});
  else logEvent(b,'issue.edit',{label:m.code, label_ar:m.code},'iss:'+id);
  E.id=id; E.dirty=false; E.leave=false; E.key=id+'|'+Date.now(); m.closedAt=meta.closedAt;
  if(!silent) toast(t('issSaved'));
  renderMain(true); return true;
}

function issueMonthStats(b, ym){
  const all=itemsOf(b,'issue'), inM=(iso)=> String(iso||'').slice(0,7)===ym;
  const opened=all.filter(x=>inM(x.openedAt)).length, closedL=all.filter(x=>x.status==='closed' && inM(x.closedAt));
  const days=closedL.map(x=> (new Date(x.closedAt)-new Date(x.openedAt||x.createdAt))/86400000).filter(v=>v>=0);
  const avg = days.length ? Math.round(days.reduce((a,v)=>a+v,0)/days.length*10)/10 : null;
  const bones={}; for(const x of all.filter(x=>inM(x.openedAt)||inM(x.closedAt))) for(const k of BONES) for(const cs of ((x.c.fb||{}).bones||{})[k]||[]) if(cs && cs.root) bones[k]=(bones[k]||0)+1;
  const top=Object.entries(bones).sort((a,b2)=>b2[1]-a[1]).slice(0,3).map(([k,n])=>({k,n}));
  return {opened, closed:closedL.length, avgDays:avg, recurring:all.filter(x=>x.recurring && (inM(x.openedAt) || issActive(x))).length, active:all.filter(issActive).length, top};
}
function monthIssuesHTML(R, fin){

}

function normShape(v){ const s=nrm(v); const f=SHAPES.find(x=>nrm(x)===s); if(f) return f; if(/قرار|decision/.test(s)) return 'Decision'; if(/بداية|start/.test(s)) return 'Start'; if(/نهاية|end/.test(s)) return 'End'; if(/مستند|document/.test(s)) return 'Document'; if(/فرعي|sub/.test(s)) return 'Subprocess'; return 'Process'; }
async function kbImportFile(file){
  const b=S.board; if(!window.XLSX){ toast(t('importFail'), true); return; }
  toast(t('importing'));
  try{
    const wb=XLSX.read(await file.arrayBuffer(), {type:'array'});
    const sheet=(names)=>{ const n=wb.SheetNames.find(s=>names.some(x=>nrm(s)===nrm(x))); return n? XLSX.utils.sheet_to_json(wb.Sheets[n], {defval:''}) : []; };
    const col=(row, ...names)=>{ for(const k of Object.keys(row)) if(names.some(n=>nrm(k)===nrm(n))) return String(row[k]??'').trim(); return ''; };
    const faqs=sheet(['FAQs','FAQ','الأسئلة الشائعة']).map(r=>({category_en:col(r,'Category (EN)'), category_ar:col(r,'Category (AR)'), q_en:col(r,'Question (EN)'), q_ar:col(r,'Question (AR)'), a_en:col(r,'Answer (EN)'), a_ar:col(r,'Answer (AR)'), source:col(r,'Source')})).filter(x=>(x.q_en||x.q_ar)&&(x.a_en||x.a_ar));
    const procs=sheet(['Processes','الإجراءات']).map(r=>({code:col(r,'Process Code'), name_en:col(r,'Process Name (EN)'), name_ar:col(r,'Process Name (AR)'), purpose_en:col(r,'Purpose (EN)'), purpose_ar:col(r,'Purpose (AR)'), owner_en:col(r,'Owner (EN)'), owner_ar:col(r,'Owner (AR)'), trigger_en:col(r,'Trigger (EN)'), trigger_ar:col(r,'Trigger (AR)'), output_en:col(r,'Output (EN)'), output_ar:col(r,'Output (AR)'), target_en:col(r,'Target (EN)'), target_ar:col(r,'Target (AR)'), source:col(r,'Source'), steps:[]})).filter(p=>p.code);
    for(const r of sheet(['Steps','Workflow','الخطوات'])){ const p=procs.find(x=>x.code===col(r,'Process Code')); if(!p) continue;
      p.steps.push({id:col(r,'Process Step ID'), shape:normShape(col(r,'Shape Type')), text_en:col(r,'Process Step Description (EN)','Process Step Description'), text_ar:col(r,'Process Step Description (AR)'), next:splitList(col(r,'Next Step ID')).filter(Boolean), labels_en:splitList(col(r,'Connector Label (EN)','Connector Label')), labels_ar:splitList(col(r,'Connector Label (AR)')), function_en:col(r,'Function (EN)','Function'), function_ar:col(r,'Function (AR)'), phase_en:col(r,'Phase (EN)','Phase'), phase_ar:col(r,'Phase (AR)')}); }
    let nf=0, np=0; const seen=new Set(itemsOf(b,'faq').map(x=>fold(x.c.q_en||x.c.q_ar)));
    for(const f of faqs){ const k=fold(f.q_en||f.q_ar); if(seen.has(k)) continue; const id=await saveItem({board:b, kind:'faq', status:'suggested', meta:{of:null, reviewedAt:null}, c:{...f, note:t('kbImportedNote')}}); if(id){ nf++; seen.add(k); } }
    const pubByCode=new Map(itemsOf(b,'process','published').map(x=>[x.c.code, x])), sugCodes=new Set(itemsOf(b,'process','suggested').map(x=>x.c.code));
    for(const p of procs){ if(!p.steps.length || sugCodes.has(p.code)) continue; const tg=pubByCode.get(p.code); const id=await saveItem({board:b, kind:'process', status:'suggested', meta:{of: tg? tg.id : null, reviewedAt:null, code:p.code}, c:{...p, note:t('kbImportedNote')}}); if(id) np++; }
    logEvent(b,'kb.import',{n:nf+np, label:String(nf+np), label_ar:String(nf+np)});
    toast(t('kbImported')(nf, np)); S.mainKey=''; render();
  }catch(e){ console.warn(e); toast(t('importFail'), true); }
}

document.addEventListener('click', async (ev)=>{
  const el=ev.target.closest('[data-action]'); if(!el) return; const a=el.dataset.action, E=S.edit;
  if(!/^(kb-|iss-)/.test(a)) return;
  const id=el.dataset.id;
  try{
  if(a==='kb-new') kbStart(el.dataset.kind, 'new');
  else if(a==='kb-view'){ ev.stopPropagation(); kbStart('process','view', id); }
  else if(a==='kb-edit') kbStart(S.items.get(id)?.kind||'faq', 'edit', id);
  else if(a==='kb-suggest') kbStart(S.items.get(id)?.kind||'faq', 'suggest', id);
  else if(a==='kb-review') kbStart(S.items.get(id)?.kind||'faq', 'review', id);
  else if(a==='kb-back') kbBack();
  else if(a==='kb-save'){ el.disabled=true; await kbSave(); el.disabled=false; }
  else if(a==='kb-approve'){ el.disabled=true; if(await kbApprove(id)){ toast(t('kbPublished')); S.mainKey=''; render(); } else el.disabled=false; }
  else if(a==='kb-publish-all'){ el.disabled=true; const list=itemsOf(S.board, el.dataset.kind, 'suggested'); let n=0; for(const x of list){ if(await kbApprove(x.id)) n++; } toast(t('kbPublishedN')(n)); S.mainKey=''; render(); }
  else if(a==='kb-reject' || a==='kb-delete' || a==='kb-withdraw' || a==='iss-delete'){ if(E){ E.confirm = a==='kb-reject'?'reject': a==='kb-withdraw'?'withdraw':'delete'; renderMain(true); } }
  else if(a==='kb-confirm-no'){ if(E){ E.confirm=''; renderMain(true); } }
  else if(a==='kb-reject-yes' || a==='kb-delete-yes' || a==='kb-withdraw-yes' || a==='iss-delete-yes'){ if(!E || !E.id) return; const x=S.items.get(E.id); const lbl=x? (x.kind==='issue'? {label:x.code, label_ar:x.code} : kbLabel(x.kind, x.c)) : {};
    if(await removeItem(E.id)){ logEvent(S.board, (x?x.kind:E.kind)+(a==='kb-reject-yes'?'.reject':'.delete'), lbl); toast(t(a==='kb-reject-yes'?'kbRejected':'kbDeleted')); S.edit=null; S.mainKey=''; render(); } }
  else if(a==='kb-reviewed'){ const x=S.items.get(id); if(x && await kbSimpleUpdate(id, {meta:{reviewedAt:new Date().toISOString()}})){ logEvent(x.board, x.kind+'.review', kbLabel(x.kind, x.c)); toast(t('kbReviewedToast')); if(E && E.mode==='view') E.key=id+'|'+Date.now(); S.mainKey=''; render(); } }
  else if(a==='kb-archive'){ const x=S.items.get(id); if(x && await kbSimpleUpdate(id, {status:'archived'})){ logEvent(x.board, x.kind+'.archive', kbLabel(x.kind, x.c)); toast(t('kbArchived')); S.mainKey=''; render(); } }
  else if(a==='kb-copy'){ const x=S.items.get(id); const text=x? String(x.c['a_'+el.dataset.l]||'') : ''; try{ await navigator.clipboard.writeText(text); toast(t('copied')); }catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast(t('copied')); }catch(e2){} ta.remove(); } }
  else if(a==='kb-import'){ let inp=$('#kbfile'); if(!inp){ inp=document.createElement('input'); inp.type='file'; inp.id='kbfile'; inp.accept='.xlsx,.xls'; inp.hidden=true; document.body.appendChild(inp); inp.addEventListener('change', async ()=>{ const f=inp.files&&inp.files[0]; inp.value=''; if(f) await kbImportFile(f); }); } inp.click(); }
  else if(a==='kb-print'){ window.print(); }
  else if(a==='kb-pview'){ if(E){ E.view=el.dataset.v; E.key=E.id+'|'+Date.now(); renderMain(true); } }
  else if(a==='kb-step-add' && E){ const st=E.draft.steps; const last=st[st.length-1]; const nid=String(Math.max(0,...st.map(s=>+s.id||0))+1); const ns={id:nid, shape:'Process', text_ar:'', text_en:'', next:[], labels_ar:[], labels_en:[], function_ar:last?last.function_ar:'', function_en:last?last.function_en:'', phase_ar:last?last.phase_ar:'', phase_en:last?last.phase_en:''}; const endAt=st.length && st[st.length-1].shape==='End' ? st.length-1 : st.length; st.splice(endAt, 0, ns); kbDirty(); renderMain(true); }
  else if(a==='kb-step-rm' && E){ E.draft.steps.splice(+el.dataset.si,1); kbDirty(); renderMain(true); }
  else if((a==='kb-step-up' || a==='kb-step-down') && E){ const i=+el.dataset.si, j=a==='kb-step-up'? i-1 : i+1, st=E.draft.steps; if(j<0||j>=st.length) return; [st[i],st[j]]=[st[j],st[i]]; kbDirty(); renderMain(true); }
  else if(a==='iss-open'){ ev.stopPropagation(); kbStart('issue','edit', id); }
  else if(a==='iss-tile'){ const [k,v]=String(el.dataset.set||'').split(':'); S.issf={st:'active'}; if(k==='od') S.issf.od=true; else if(k) S.issf[k]=v||''; if(k==='st') S.issf.st=v; S.mainKey=''; render(); }
  else if(a==='iss-save'){ el.disabled=true; await issSave(); el.disabled=false; }
  else if(a==='iss-post' && E){ const ta=$('#iss-update'); const text=String(ta&&ta.value||'').trim(); if(!text) return; E.draft.c.updates.push({at:new Date().toISOString(), by:S.me.id||null, name:myName()||'', text}); await issSave(true); }
  else if(a==='iss-occ-add' && E){ E.draft.c.occ.push({at:todayISO(), note:''}); if(E.draft.c.occ.length>=2) E.draft.meta.recurring=true; kbDirty(); renderMain(true); }
  else if(a==='iss-occ-rm' && E){ E.draft.c.occ.splice(+el.dataset.i,1); kbDirty(); renderMain(true); }
  else if(a==='iss-cause-add' && E){ const k=el.dataset.ib; E.draft.c.fb.bones[k].push({cause:'', root:false, solution:'', owner:'', due:''}); kbDirty(); renderMain(true); const ins=document.querySelectorAll(`[data-ib="${k}"][data-ik="cause"]`); ins[ins.length-1]?.focus(); }
  else if(a==='iss-cause-rm' && E){ E.draft.c.fb.bones[el.dataset.ib].splice(+el.dataset.ix,1); kbDirty(); renderMain(true); }
  else if(a==='iss-esc-now' && E){ E.draft.c.esc.at=new Date().toISOString(); if(!['resolved','closed'].includes(E.draft.meta.status)) E.draft.meta.status='waiting'; kbDirty(); await issSave(true); }
  else if(a==='iss-esc-resp' && E){ E.draft.c.esc.respondedAt=new Date().toISOString(); if(E.draft.meta.status==='waiting') E.draft.meta.status='progress'; kbDirty(); await issSave(true); }
  else if(a==='iss-send'){ el.disabled=true; await issSendTasks(); }
  else if(a==='iss-close' && E){ const c=E.draft.c; if(!c.resolution){ toast(t('issNeedResolution'), true); $('#if-resolution')?.focus(); return; }
    const roots=BONES.flatMap(k=>c.fb.bones[k]||[]).filter(cs=>cs && cs.root); if(roots.length && !roots.some(cs=>String(cs.solution||'').trim())){ toast(t('issNeedSolution'), true); return; }
    E.draft.meta.status='closed'; E.draft.meta.closedAt=new Date().toISOString(); await issSave(); }
  else if(a==='iss-reopen' && E){ E.draft.meta.status='open'; E.draft.meta.closedAt=''; await issSave(); logEvent(S.board,'issue.reopen',{label:E.draft.meta.code, label_ar:E.draft.meta.code}); }
  }catch(err){ console.warn(err); toast(t('saveFail'), true); }
});
document.addEventListener('input', (ev)=>{
  const el=ev.target;
  if(el.id==='kbq'){ S.kbq=el.value; renderDeptBody(); return; }
  if(el.id==='pq'){ S.pq=el.value; renderDeptBody(); return; }
  if(el.id==='issq'){ S.issq=el.value; renderDeptBody(); return; }
  if(el.id==='kbcat'){ S.kbcat=el.value; renderDeptBody(); return; }
  if(el.dataset && el.dataset.issf!==undefined && el.tagName==='SELECT'){ S.issf=S.issf||{st:'active'}; S.issf[el.dataset.issf]=el.value; delete S.issf.od; renderDeptBody(); return; }
  const E=S.edit; if(!E || !el.closest('#main')) return;
  if(E.kind==='faq' && el.dataset.kf){ E.draft[el.dataset.kf]=el.value; kbDirty(); return; }
  if(E.kind==='process'){
    if(el.dataset.pm){ E.draft[el.dataset.pm]=el.value; kbDirty(); procPreviewSoon(); return; }
    if(el.dataset.ps){ const s=E.draft.steps[+el.dataset.si]; if(s){ const f=el.dataset.ps; s[f] = ['next','labels_ar','labels_en'].includes(f) ? splitList(el.value) : el.value; if(f==='shape'){ kbDirty(); renderMain(true); return; } } kbDirty(); procPreviewSoon(); return; }
  }
  if(E.kind==='issue'){
    const m=E.draft.meta, c=E.draft.c;
    if(el.dataset.if){ c[el.dataset.if]=el.value; if(el.dataset.if==='party'){ kbDirty(); renderMain(true); return; } }
    else if(el.dataset.im){ const k=el.dataset.im;
      if(el.type==='checkbox'){ m[k]=el.checked; kbDirty(); renderMain(true); return; }
      if(k==='dueAt'){ m.dueAt = el.value ? new Date(el.value).toISOString() : ''; m.dueManual=true; }
      else { m[k]=el.value; if(k==='severity'){ if(!m.dueManual){ m.dueAt=issDue(el.value, m.openedAt); const dd=$('#im-dueAt'); if(dd) dd.value=toLocalInput(m.dueAt); } const sn=document.querySelector('.sevnote'); if(sn) sn.textContent=(t('sevDef')||{})[el.value]||''; } } }
    else if(el.dataset.ie){ c.esc[el.dataset.ie]=el.value; }
    else if(el.dataset.ifb){ c.fb.problem=el.value; fbRefresh(); }
    else if(el.dataset.ib){ const cs=(c.fb.bones[el.dataset.ib]||[])[+el.dataset.ix]; if(cs){ const k=el.dataset.ik; cs[k] = el.type==='checkbox' ? el.checked : el.value; if(k==='cause' || k==='root') fbRefresh(); } }
    else if(el.dataset.iv){ c.verify[el.dataset.iv]=el.value; }
    else if(el.dataset.io!==undefined){ const o=c.occ[+el.dataset.io]; if(o) o[el.dataset.ok||'note']=el.value; }
    else return;
    kbDirty();
  }
});
document.addEventListener('toggle', (ev)=>{ const d=ev.target; if(d && d.matches && d.matches('details.faq')){ S.kbOpen=S.kbOpen||new Set(); if(d.open) S.kbOpen.add(d.dataset.id); else S.kbOpen.delete(d.dataset.id); } }, true);
window.addEventListener('beforeunload', (ev)=>{ if(S.edit && S.edit.dirty && S.edit.mode!=='view'){ ev.preventDefault(); ev.returnValue=''; } });

/* ---------- text direction: what people type keeps the direction of its own language ----------
   An Arabic title shown in the English view (or an English one in the Arabic view) reads in the right order. The direction follows
   the language most of the letters are in, so an Arabic sentence that starts with a brand name such as Marn Pay stays right to left. */
const AR_LETTERS=/[؀-ۿݐ-ݿࢠ-ࣿﭐ-﷿ﹰ-﻿]/g, LATIN_LETTERS=/[A-Za-z]/g;
function textDir(s){ s=String(s||''); const a=(s.match(AR_LETTERS)||[]).length, l=(s.match(LATIN_LETTERS)||[]).length; return !a && !l ? '' : (a>=l ? 'rtl' : 'ltr'); }
const DIR_FIELDS='input:not([type]),input[type="text"],input[type="search"],textarea';
const DIR_SEL=DIR_FIELDS+',.vhead h1,.title .t,.qmain b,details.faq .q,.atext';
function fixDir(el){ const d=textDir(el.matches(DIR_FIELDS) ? el.value : el.textContent), page=document.documentElement.getAttribute('dir')||'rtl';
  if(d && d!==page) el.setAttribute('dir', d); else if(el.hasAttribute('dir')) el.removeAttribute('dir'); }
(function(){ const m=document.getElementById('main'); if(!m || !window.MutationObserver) return;
  const run=(root)=>{ if(root.nodeType!==1) return; if(root.matches(DIR_SEL)) fixDir(root); root.querySelectorAll(DIR_SEL).forEach(fixDir); };
  new MutationObserver(list=>{ for(const r of list) r.addedNodes.forEach(run); }).observe(m, {childList:true, subtree:true});
  document.addEventListener('input', ev=>{ const el=ev.target; if(el && el.matches && el.matches(DIR_FIELDS) && el.closest('#main')) fixDir(el); }, true); })();

/* ---------- boot ---------- */
async function boot(){
  try{ const l=localStorage.getItem('marn.lang'); if(l==='en'||l==='ar') S.lang=l; }catch(e){}
  try{ const v=localStorage.getItem('marn.bview'); if(['table','kanban','timeline'].includes(v)) S.boardView=v; }catch(e){}
  const hash=(location.hash||'').replace('#','');
  const [h1,h2]=hash.split('/');
  if(['home','ceo','access','mine','overdue','activity'].includes(h1)) S.view=h1; else if(BOARDS.some(b=>b.id===h1)){ S.view='board'; S.board=h1; if(SECTIONS.includes(h2)) S.section=h2; }
  setLang(S.lang);
  await restoreKey();
  const caps = window.__marnCapsPromise ? await window.__marnCapsPromise : (window.__marnCaps || null);
  const use = (name)=> caps? Promise.resolve(caps[name]||null) : (window.claude && window.claude.use ? window.claude.use(name) : Promise.resolve(null));
  const [db, user, downloads] = await Promise.all([use('db'), use('user'), use('downloads')]);
  S.db=db; S.user=user; S.downloads=downloads;
  if(user){ try{ const me=await user.me(); S.me={id:me.id, name:me.name||'', email:me.email||'', isCEO:!!me.isCEO, avatarUrl:me.avatarUrl||'', isOwner:!!me.isOwner, canEdit:!!me.canEdit, canWrite: await user.can('data.write')}; }catch(e){} }
  if(!db){ S.connecting=false; render(); return; }
  subscribeAll();
  setTimeout(()=>{ if(!S.tasksLoaded){ S.connecting=false; render(); } }, 12000);
  render();
}
boot();
})();
</script>

<script>
/* 3D tilt for tiles and achievement plaques: follows the pointer, gently; off for touch and reduced motion */
(function(){
  var fine = window.matchMedia && matchMedia('(hover:hover) and (pointer:fine)').matches;
  var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!fine || calm) return;
  var SEL = '.tile, .ach-card', cur = null, raf = 0, last = null;
  function reset(el){ el.classList.remove('hot'); el.style.removeProperty('--rx'); el.style.removeProperty('--ry'); }
  document.addEventListener('pointerover', function(e){ var el = e.target.closest && e.target.closest(SEL); if(el && !el.classList.contains('tilt')) el.classList.add('tilt'); });
  document.addEventListener('pointermove', function(e){
    var el = e.target.closest && e.target.closest(SEL);
    if(cur && cur !== el) reset(cur);
    cur = el; if(!el) return; last = e;
    if(raf) return;
    raf = requestAnimationFrame(function(){
      raf = 0; if(!cur || !last) return;
      var r = cur.getBoundingClientRect(), x = (last.clientX - r.left) / r.width, y = (last.clientY - r.top) / r.height;
      var max = cur.classList.contains('tile') ? 6 : 4;
      cur.classList.add('tilt','hot');
      cur.style.setProperty('--ry', ((x - .5) * max * 2).toFixed(2) + 'deg');
      cur.style.setProperty('--rx', ((.5 - y) * max * 2).toFixed(2) + 'deg');
      cur.style.setProperty('--mx', (x * 100).toFixed(1) + '%');
      cur.style.setProperty('--my', (y * 100).toFixed(1) + '%');
    });
  }, {passive:true});
  document.addEventListener('pointerleave', function(){ if(cur){ reset(cur); cur = null; } }, true);
  window.addEventListener('blur', function(){ if(cur){ reset(cur); cur = null; } });
})();
</script>
