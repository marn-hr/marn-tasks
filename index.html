<script type="module">
// Marn Tasks, web edition: sign-in with Google and the shared store on Firestore.
// Reads window.MARN_CONFIG from config.js. Loaded as a module after config.js.
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, onSnapshot, setDoc, updateDoc, getDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const C = window.MARN_CONFIG || {};
const lang = (()=>{ try{ return localStorage.getItem('marn.lang')==='en' ? 'en' : 'ar'; }catch(e){ return 'ar'; } })();
const TX = {
  ar:{ title:'مهام مرن', lead:'سجّل الدخول بحساب مرن على Google', btn:'تسجيل الدخول بحساب Google', notAllowed:'هذا الحساب ليس ضمن نطاق مرن. سجّل الدخول ببريد العمل.', setup:'لم يُستكمل الإعداد بعد: املأ ملف config.js ببيانات مشروع Firebase.', signing:'جارٍ تسجيل الدخول…', err:'تعذّر تسجيل الدخول. حاول مرة أخرى.' },
  en:{ title:'Marn Tasks', lead:'Sign in with your Marn Google account', btn:'Sign in with Google', notAllowed:'This account is not a Marn account. Sign in with your work email.', setup:'Setup is not complete: fill config.js with the Firebase project details.', signing:'Signing in…', err:'Sign-in did not work. Try again.' },
}[lang];

const MARK = '<svg viewBox="252.746 94.633 53.402 53.559" fill="currentColor" aria-hidden="true" style="width:44px;height:44px;display:block;margin:0 auto 14px"><path d="M 304.66 94.84 C 303.57 94.63 280.55 94.63 279.02 94.84 C 278.01 94.97 277.57 96.12 277.71 98.3 C 277.88 106.12 276.59 111.07 272.91 114.61 C 269.21 118.18 264.43 119.41 256.54 119.7 C 253.08 119.84 253.27 121.26 253.27 123.08 L 253.27 144.81 C 253.27 146.62 252.75 148.19 256.49 148.19 L 256.69 148.19 C 272.21 148.03 285.71 144.26 294.52 134.9 C 303.3 125.55 306.15 112.55 305.72 97.92 C 305.67 96.07 305.73 95.04 304.66 94.84"/></svg>';

// sign-in overlay
let doSignIn = null;
const ov = document.createElement('div');
ov.id = 'signin';
ov.setAttribute('dir', lang==='ar' ? 'rtl' : 'ltr');
ov.setAttribute('lang', lang);
ov.style.cssText = 'position:fixed;inset:0;z-index:50;background:var(--bg,#FAF7F2);color:var(--fg,#1B191A);display:flex;align-items:center;justify-content:center;padding:24px;font-family:inherit';
function overlay(state, msg){
  const box = `<div style="max-width:380px;width:100%;text-align:center;border:1px solid var(--g2,#E6E1D8);border-radius:4px;padding:32px 26px;background:var(--surface,#FFFEFB)">${MARK}<h1 style="font-size:22px;margin:0 0 6px">${TX.title}</h1><p style="margin:0 0 18px;color:var(--g5,#6E6861)">${TX.lead}</p>${state==='button' ? `<button id="gbtn" type="button" style="height:40px;padding:0 18px;border-radius:4px;border:1px solid var(--fg,#1B191A);background:var(--fg,#1B191A);color:var(--bg,#FAF7F2);font:inherit;font-weight:500;cursor:pointer">${TX.btn}</button>` : ''}${msg ? `<p style="margin:16px 0 0;color:var(--fg,#1B191A);font-weight:500">${msg}</p>` : ''}</div>`;
  ov.innerHTML = box;
  if(!ov.isConnected) document.body.appendChild(ov);
  const b = ov.querySelector('#gbtn'); if(b) b.addEventListener('click', ()=>{ if(doSignIn) doSignIn(); });
}
function hideOverlay(){ if(ov.isConnected) ov.remove(); }

const resolveCaps = window.__marnResolveCaps || (()=>{});

if(!C.firebase || !C.firebase.apiKey || !C.firebase.projectId){ overlay('none', TX.setup); resolveCaps(null); }
else {
  const app = initializeApp(C.firebase);
  const auth = getAuth(app);
  const fs = getFirestore(app);
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt:'select_account', ...(C.allowedDomains && C.allowedDomains.length===1 ? { hd: C.allowedDomains[0] } : {}) });

  const allowed = (email)=>{
    if(!email) return false; const e = email.toLowerCase(); const d = e.split('@')[1] || '';
    return (C.allowedDomains||[]).map(x=>x.toLowerCase()).includes(d) || (C.allowedEmails||[]).map(x=>x.toLowerCase()).includes(e);
  };
  const isOwner = (email)=> (C.owners||[]).map(x=>x.toLowerCase()).includes((email||'').toLowerCase());

  doSignIn = async function(){
    overlay('none', TX.signing);
    try{ await setPersistence(auth, browserLocalPersistence); await signInWithPopup(auth, provider); }
    catch(e){
      if(e && (e.code==='auth/popup-blocked' || e.code==='auth/operation-not-supported-in-this-environment' || e.code==='auth/cancelled-popup-request')){ try{ await signInWithRedirect(auth, provider); return; }catch(e2){} }
      if(e && e.code==='auth/popup-closed-by-user'){ overlay('button'); return; }
      console.warn(e); overlay('button', TX.err);
    }
  };
  window.__marnSignOut = ()=> signOut(auth).then(()=> location.reload());

  // store adapter: the same small surface the app uses
  const clean = (d)=> JSON.parse(JSON.stringify(d));
  const wrapD = (s)=> ({ id:s.id, exists: typeof s.exists==='function' ? s.exists() : !!s.exists, data:()=> s.data(), metadata: s.metadata||{} });
  const wrapQ = (s)=> ({ docs:s.docs.map(wrapD), size:s.size, empty:s.empty, docChanges:()=>[], metadata:s.metadata||{} });
  function docRef(path){ const r = doc(fs, ...path.split('/')); return { id:r.id, path, set:(d)=> setDoc(r, clean(d)), update:(d)=> updateDoc(r, clean(d)), delete:()=> deleteDoc(r), get: async()=> wrapD(await getDoc(r)), onSnapshot:(cb,err)=> onSnapshot(r, s=> cb(wrapD(s)), err), collection:(sub)=> colRef(path+'/'+sub) }; }
  function colRef(path){ const parts = path.split('/'); const c = collection(fs, ...parts); return { path, doc:(id)=> id ? docRef(path+'/'+id) : docRef(path+'/'+doc(c).id), add: async(d)=>{ const r = doc(c); await setDoc(r, clean(d)); return docRef(path+'/'+r.id); }, get: async()=> wrapQ(await getDocs(c)), onSnapshot:(cb,err)=> onSnapshot(c, s=> cb(wrapQ(s)), err), where(){ return this; }, orderBy(){ return this; }, limit(){ return this; } }; }
  const db = { doc: docRef, collection: colRef };

  // people: names come from the members collection, written by each person at sign-in
  const members = new Map();
  let me = null;
  const user = {
    isOwner: async()=> !!me && isOwner(me.email),
    canEdit: async()=> true,
    can: async()=> true,
    id: async()=> me ? me.uid : null,
    name: async()=> me ? (me.displayName||'') : '',
    email: async()=> me ? me.email : null,
    avatarUrl: async()=> me ? (me.photoURL||null) : null,
    me: async()=> ({ id: me?me.uid:null, name: me?(me.displayName||''):'', avatarUrl: me?(me.photoURL||''):'', color:'#1B191A', email: me?me.email:null, isOwner: !!me && isOwner(me.email), canEdit: true }),
    profiles: async(ids)=>{ const o={}; for(const id of (Array.isArray(ids)?ids:[ids])){ const m=members.get(id)||{}; o[id]={ id, name:m.name||'', avatarUrl:m.photo||'', color:'#1B191A', email:m.email||null, isMe: !!me && id===me.uid, guest:false }; } return o; },
    search: async()=> [],
  };
  const downloads = { save: async({filename, data})=>{ const blob = data instanceof Blob ? data : new Blob([data]); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=> URL.revokeObjectURL(url), 4000); return {status:'saved'}; } };

  getRedirectResult(auth).catch(()=>{});
  onAuthStateChanged(auth, async (u)=>{
    if(!u){ me=null; overlay('button'); return; }
    if(!allowed(u.email)){ await signOut(auth).catch(()=>{}); me=null; overlay('button', TX.notAllowed); return; }
    me = u;
    try{ await setDoc(doc(fs,'members',u.uid), { name: u.displayName||'', email: u.email||'', photo: u.photoURL||'', seenAt: new Date().toISOString() }, { merge:true }); }catch(e){ console.warn('members', e); }
    onSnapshot(collection(fs,'members'), s=>{ members.clear(); s.docs.forEach(d=> members.set(d.id, d.data())); });
    hideOverlay();
    resolveCaps({ db, user, downloads });
  });
}

</script>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Almarai:wght@400;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: a board rail on the start side, the working view in the centre, a detail drawer on the end side.
   The content's shape is a matrix (units x task state), so tables and columns lead; colour is one value ramp of Marn charcoal on off-white. */
:root{
  --bg:#FAF7F2; --fg:#1B191A; --surface:#FFFEFB;
  --g1:#F3EFE8; --g2:#E6E1D8; --g3:#CFC8BD; --g4:#A69F94; --g5:#6E6861; --g6:#3B3837;
  --font-latin:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-arabic:"Avenir Arabic","Almarai","DM Sans",system-ui,sans-serif;
  --font:var(--font-latin);
  --radius:4px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1B191A; --fg:#FAF7F2; --surface:#211F1F; --g1:#232121; --g2:#302D2D; --g3:#474342; --g4:#7F7870; --g5:#B5AEA4; --g6:#E4DFD6; color-scheme:dark }
}
:root[data-theme="dark"]{ --bg:#1B191A; --fg:#FAF7F2; --surface:#211F1F; --g1:#232121; --g2:#302D2D; --g3:#474342; --g4:#7F7870; --g5:#B5AEA4; --g6:#E4DFD6; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app[lang="ar"]{--font:var(--font-arabic)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--g5)}
.small{font-size:12px}
.hairline{border:0;border-top:1px solid var(--g2);margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.topbar{display:flex;align-items:center;gap:14px;min-height:60px;padding-block:8px;border-bottom:1px solid var(--g2);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:6}
.brand{display:flex;align-items:center;gap:12px;flex:none}
.brand .logo-en{height:22px;width:auto;display:block}
.brand .logo-ar{height:38px;width:auto;display:block}
.brand .sep{width:1px;height:26px;background:var(--g3)}
.brand .product{font-weight:700;font-size:16px;letter-spacing:.01em}
.topbar .grow{flex:1}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--g3);border-radius:var(--radius);padding:0 10px;height:36px;min-width:0;width:min(420px,38vw);background:var(--surface)}
.search input{border:0;background:transparent;flex:1;min-width:0;height:34px;outline:0}
.search svg{flex:none;color:var(--g4)}
.iconbtn{height:36px;min-width:36px;padding:0 10px;border:1px solid var(--g3);border-radius:var(--radius);background:transparent;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.iconbtn:hover{border-color:var(--fg)}
.mechip{display:flex;align-items:center;gap:8px;max-width:220px}
.mechip img{width:28px;height:28px;border-radius:50%;flex:none;background:var(--g2)}
.mechip .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mechip .ro{font-size:11px;color:var(--g5);border:1px solid var(--g3);border-radius:999px;padding:1px 7px}

/* shell */
.shell{flex:1;display:flex;min-height:0}
.rail{width:260px;flex:none;border-inline-end:1px solid var(--g2);overflow:auto;padding-block:14px;padding-inline-end:12px}
.rail h4{margin:14px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--g4);font-weight:500}
#app[lang="ar"] .rail h4{letter-spacing:0;font-size:12px}
.rail .item{display:flex;align-items:center;gap:10px;width:100%;text-align:start;border:0;background:transparent;padding:7px 10px;border-radius:var(--radius);position:relative;color:var(--g6)}
.rail .item:hover{background:var(--g1)}
.rail .item.on{color:var(--fg);font-weight:700;background:var(--g1)}
.rail .item.on::before{content:"";position:absolute;inset-inline-start:-1px;top:6px;bottom:6px;width:3px;background:var(--fg)}
.rail .item .lbl{flex:1;min-width:0}
.rail .item .cnt{font-size:12px;color:var(--g4);font-variant-numeric:tabular-nums}
.rail .item.on .cnt{color:var(--g5)}
.rail .item .cnt b{color:var(--fg);font-weight:700}
svg.lock{width:12px;height:12px;flex:none;color:var(--g4);vertical-align:-1px;margin-inline-end:4px}
.rail .rsep{display:none}
.lockpanel h2 svg.lock{width:18px;height:18px;color:var(--fg)}

.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:auto;padding-inline-start:24px;padding-block:18px 32px}
.vhead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.vhead h1{margin:0;font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
#app[lang="ar"] .vhead h1{letter-spacing:0}
.vhead .sub{color:var(--g5);padding-bottom:3px}
.vhead .actions{margin-inline-start:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{height:36px;padding:0 14px;border-radius:var(--radius);border:1px solid var(--g3);background:transparent;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.primary:hover{opacity:.9}
.btn.danger{color:var(--fg);border-color:var(--g3)}
.btn[disabled]{opacity:.5;cursor:default}
.tabs{display:flex;gap:2px;border:1px solid var(--g3);border-radius:var(--radius);padding:2px;background:var(--surface)}
.tabs button{border:0;background:transparent;padding:0 12px;height:30px;border-radius:3px;color:var(--g5)}
.tabs button.on{background:var(--fg);color:var(--bg)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar select,.toolbar .toggle{height:34px;border:1px solid var(--g3);border-radius:var(--radius);background:var(--surface);padding:0 8px;max-width:220px}
.toolbar .toggle{display:inline-flex;align-items:center;gap:8px;padding:0 10px;cursor:pointer}
.toolbar .toggle input{margin:0}
.toolbar .spacer{flex:1}
.toolbar .count{color:var(--g5);font-size:13px}

/* tiles and overview matrix */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
.tile{border:1px solid var(--g2);border-radius:var(--radius);padding:14px 16px;background:var(--surface);text-align:start;cursor:pointer}
.tile:hover{border-color:var(--g4)}
.tile .k{font-size:12px;color:var(--g5);text-transform:uppercase;letter-spacing:.06em}
#app[lang="ar"] .tile .k{letter-spacing:0;font-size:13px}
.tile .v{font-size:34px;font-weight:700;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.tile.stuck .v,.tile.overdue .v{position:relative;display:inline-block}
.tile.overdue .v::after{content:"";position:absolute;inset-inline-end:-14px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--fg)}
.matrix{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--g2)}
.matrix th,.matrix td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--g2);vertical-align:middle}
.matrix th{font-size:12px;color:var(--g5);font-weight:500;letter-spacing:.04em;text-transform:uppercase;background:var(--g1)}
#app[lang="ar"] .matrix th{letter-spacing:0;font-size:13px}
.matrix td.n{font-variant-numeric:tabular-nums;text-align:center;width:84px;color:var(--g5)}
.matrix td.n b{color:var(--fg)}
.matrix th.c{text-align:center}
.matrix tr.row{cursor:pointer}
.matrix tr.row:hover td{background:var(--g1)}
.matrix td.name{font-weight:500}
.bar{display:flex;height:8px;width:100%;min-width:140px;background:var(--g2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%}
.bar .b-done{background:var(--g3)}
.bar .b-doing{background:var(--g4)}
.bar .b-stuck{background:var(--fg)}
.bar .b-todo{background:transparent}
.legend{display:flex;gap:16px;margin:10px 0 0;color:var(--g5);font-size:12px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:6px;vertical-align:-1px;background:var(--g2)}
.legend .l-stuck::before{background:var(--fg)}
.legend .l-doing::before{background:var(--g4)}
.legend .l-done::before{background:var(--g3)}
.legend .l-todo::before{background:var(--bg);border:1px solid var(--g3)}
.section{margin-top:26px}
.section h2{font-size:16px;margin:0 0 10px;font-weight:700}

/* task table */
.tscroll{overflow-x:auto;border:1px solid var(--g2);border-radius:var(--radius);background:var(--surface)}
.ttable{width:100%;border-collapse:collapse;min-width:720px}
.ttable th,.ttable td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--g2);vertical-align:middle;white-space:nowrap}
.ttable th{font-size:12px;color:var(--g5);font-weight:500;letter-spacing:.04em;text-transform:uppercase;background:var(--g1);position:sticky;top:0;z-index:1;cursor:pointer;user-select:none}
#app[lang="ar"] .ttable th{letter-spacing:0;font-size:13px}
.ttable th.sorted{color:var(--fg)}
.ttable th .arrow{font-size:10px;margin-inline-start:4px}
.ttable td.title{white-space:normal;min-width:260px;max-width:460px;cursor:pointer}
.ttable td.title .t{font-weight:500}
.ttable td.title .meta{font-size:12px;color:var(--g5);display:flex;gap:10px;margin-top:2px;flex-wrap:wrap}
.ttable tr.task:hover td{background:var(--g1)}
.ttable tr.task.done td.title .t{color:var(--g5)}
.ttable tr.group td{background:var(--bg);font-weight:700;font-size:13px;padding-top:12px;border-bottom:1px solid var(--g3)}
.ttable tr.group td span{color:var(--g4);font-weight:400;margin-inline-start:8px}
.ttable td.owner{max-width:200px;overflow:hidden;text-overflow:ellipsis}
.ttable td.ref{font-size:12px;color:var(--g5)}
.ttable td.when{font-size:12px;color:var(--g5)}

/* status chip (native select) */
.chip{appearance:none;-webkit-appearance:none;border-radius:999px;height:26px;padding:0 24px 0 10px;font-size:12px;font-weight:500;line-height:24px;border:1px solid var(--g3);background:transparent;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23888' stroke-width='1.4'/></svg>");background-repeat:no-repeat;background-position:right 8px center}
#app[dir="rtl"] .chip{padding:0 10px 0 24px;background-position:left 8px center}
.chip.s-todo{border:1px dashed var(--g4);color:var(--g5)}
.chip.s-doing{background-color:var(--g2);border-color:var(--g2);color:var(--fg)}
.chip.s-stuck{background-color:var(--fg);border-color:var(--fg);color:var(--bg);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23bbb' stroke-width='1.4'/></svg>")}
.chip.s-done{border-color:var(--g3);color:var(--g4)}
.chip.lg{height:34px;line-height:32px;font-size:13px}

/* priority bars */
.pri{display:inline-flex;align-items:flex-end;gap:2px;height:14px;vertical-align:middle}
.pri i{display:block;width:4px;background:var(--g3);border-radius:1px}
.pri i:nth-child(1){height:6px}.pri i:nth-child(2){height:10px}.pri i:nth-child(3){height:14px}
.pri.p-low i:nth-child(1){background:var(--fg)}
.pri.p-med i:nth-child(-n+2){background:var(--fg)}
.pri.p-high i{background:var(--fg)}
.pri + .plabel{margin-inline-start:6px;font-size:12px;color:var(--g5)}

/* due */
.due{font-variant-numeric:tabular-nums}
.due.overdue{font-weight:700}
.due.overdue::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--fg);margin-inline-end:6px;vertical-align:1px}
.due.today{font-weight:700;text-decoration:underline;text-underline-offset:3px}
.due .dl{font-weight:400;color:var(--g5);font-size:12px;margin-inline-start:6px}

/* kanban */
.kanban{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;padding-bottom:8px}
.col{flex:1 0 250px;max-width:340px;background:var(--g1);border-radius:var(--radius);padding:10px;min-height:200px;border:1px solid transparent}
.col.over{border-color:var(--fg)}
.col h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--g5);display:flex;justify-content:space-between;font-weight:500}
#app[lang="ar"] .col h3{letter-spacing:0;font-size:13px}
.col h3 b{color:var(--fg)}
.col.c-stuck h3{color:var(--fg)}
.card{background:var(--surface);border:1px solid var(--g2);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;cursor:grab}
.card:hover{border-color:var(--g4)}
.ach-hero{display:flex;align-items:baseline;gap:12px;margin:2px 0 20px;flex-wrap:wrap}
.ach-hero .n{font-size:56px;font-weight:700;line-height:1}
.ach-hero .l{color:var(--g5);font-size:15px}
.ach-sec{margin-bottom:24px}
.ach-sec h3{display:flex;gap:10px;align-items:baseline;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--g2);font-weight:500}
.ach-sec h3 span{font-size:15px;font-weight:700}
.ach-sec h3 b{font-size:13px;color:var(--g5);font-weight:500}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.ach-card{background:var(--surface);border:1px solid var(--g2);border-radius:var(--radius);padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.ach-card:hover{border-color:var(--g4)}
.ach-card .t{font-weight:600;line-height:1.45}
.ach-card .imp{font-size:13px;line-height:1.55;color:var(--g6)}
.ach-card .dep{font-size:12px;color:var(--g5);margin-top:auto;padding-top:4px}
.card.dragging{opacity:.5}
.card .t{font-weight:500;margin-bottom:6px;cursor:pointer}
.card .row{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--g5);flex-wrap:wrap}
.card .row .owner{flex:1;min-width:0}
.card .bottom{display:flex;flex-direction:column;align-items:flex-start;margin-top:8px;gap:6px}
.due{white-space:nowrap}
.col.c-stuck .card{border-inline-start:3px solid var(--fg)}
.col.c-done .card{opacity:.75}

/* timeline */
.tl-wrap{overflow:auto;border:1px solid var(--g2);border-radius:var(--radius);background:var(--surface);max-height:70vh}
.tl{display:grid;position:relative;font-size:12px}
.tl .lab{position:sticky;inset-inline-start:0;background:var(--surface);border-inline-end:1px solid var(--g2);padding:5px 10px;z-index:2;border-bottom:1px solid var(--g2);cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3;min-height:32px}
.tl .lab:hover{background:var(--g1)}
.tl .hm{position:sticky;top:0;background:var(--g1);border-bottom:1px solid var(--g2);padding:4px 8px;font-weight:700;white-space:nowrap;overflow:hidden;z-index:3;border-inline-end:1px solid var(--g2)}
.tl .hd{position:sticky;top:26px;background:var(--g1);border-bottom:1px solid var(--g2);text-align:center;color:var(--g5);padding:3px 0;z-index:3;font-variant-numeric:tabular-nums}
.tl .hd.we{background:var(--g2)}
.tl .hd.today{color:var(--fg);font-weight:700}
.tl .corner{position:sticky;inset-inline-start:0;top:0;z-index:4;background:var(--g1);border-inline-end:1px solid var(--g2);border-bottom:1px solid var(--g2)}
.tl .cell{border-bottom:1px solid var(--g2);min-height:32px}
.tl .cell.we{background:var(--g1)}
.tl .cell.today{border-inline-start:2px solid var(--fg)}
.tl .barw{position:relative;min-height:32px;z-index:1;pointer-events:none}
.tl .tbar{position:absolute;top:7px;bottom:7px;inset-inline-start:2px;inset-inline-end:2px;background:var(--g4);border-radius:3px;cursor:pointer;pointer-events:auto;display:flex;align-items:center;padding:0 6px;color:var(--bg);font-size:11px;overflow:hidden;white-space:nowrap}
.tl .tbar.s-stuck{background:var(--fg)}
.tl .tbar.s-done{background:var(--g3);color:var(--fg)}
.tl .tbar.s-todo{background:transparent;border:1px dashed var(--g4);color:var(--g5)}
.tl .tbar.overdue{outline:2px solid var(--fg);outline-offset:-2px}

/* lists (activity, overdue) */
.list{border:1px solid var(--g2);border-radius:var(--radius);background:var(--surface)}
.list .li{display:flex;gap:12px;padding:10px 14px;border-bottom:1px solid var(--g2);align-items:flex-start;cursor:pointer}
.list .li:last-child{border-bottom:0}
.list .li:hover{background:var(--g1)}
.list .li .when{color:var(--g4);font-size:12px;flex:none;width:110px;font-variant-numeric:tabular-nums}
.list .li .what{flex:1;min-width:0}
.list .li .what .t{font-weight:500}
.list .li .what .d{color:var(--g5);font-size:12px;margin-top:2px}
.list .li .where{color:var(--g5);font-size:12px;flex:none}

/* empty */
.empty{border:1px dashed var(--g3);border-radius:var(--radius);padding:38px 20px;text-align:center;color:var(--g5)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:6px;font-weight:700}
.notice{max-width:560px;margin:40px auto;border:1px solid var(--g2);border-radius:var(--radius);padding:28px;background:var(--surface)}
.notice h2{margin:0 0 10px;font-size:20px}
.notice p{margin:0 0 10px;color:var(--g5)}

/* lock panel */
.lockpanel{max-width:520px;border:1px solid var(--g2);border-radius:var(--radius);padding:26px;background:var(--surface)}
.lockpanel h2{margin:0 0 6px;font-size:20px;display:flex;align-items:center;gap:10px}
.lockpanel p{color:var(--g5);margin:0 0 14px}
.lockpanel .f{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.lockpanel input{height:38px;border:1px solid var(--g3);border-radius:var(--radius);padding:0 10px;background:var(--bg);flex:1;min-width:180px}
.lockpanel .err{color:var(--fg);font-weight:500;margin:4px 0 10px}
.lockpanel .rc{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:18px;letter-spacing:.06em;border:1px dashed var(--g4);padding:12px 14px;border-radius:var(--radius);margin:10px 0;direction:ltr;text-align:center;user-select:all}
.linkbtn{border:0;background:transparent;color:var(--g5);text-decoration:underline;text-underline-offset:3px;padding:0;height:auto}

/* identity bar */
.idbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--g2);color:var(--g5)}
.idbar input{height:34px;border:1px solid var(--g3);border-radius:var(--radius);padding:0 10px;background:var(--surface);min-width:160px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(27,25,26,.25);z-index:20}
.drawer{position:fixed;top:env(safe-area-inset-top,0px);bottom:0;inset-inline-end:0;width:min(560px,100%);background:var(--bg);border-inline-start:1px solid var(--g2);z-index:21;display:flex;flex-direction:column;box-shadow:-12px 0 30px rgba(0,0,0,.08)}
#app[dir="rtl"] .drawer{box-shadow:12px 0 30px rgba(0,0,0,.08)}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--g2)}
.drawer .dh .bname{font-size:12px;color:var(--g5);text-transform:uppercase;letter-spacing:.06em;flex:1}
#app[lang="ar"] .drawer .dh .bname{letter-spacing:0;font-size:13px}
.drawer .db{flex:1;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.drawer .titlein{width:100%;font-size:20px;font-weight:700;border:0;border-bottom:1px solid transparent;background:transparent;padding:4px 0;margin-bottom:12px;outline:0;line-height:1.3}
.drawer .titlein:focus{border-bottom-color:var(--fg)}
.drawer .titlein::placeholder{color:var(--g4);font-weight:500}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.fgrid .full{grid-column:1 / -1}
.field label{display:block;font-size:12px;color:var(--g5);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;height:36px;border:1px solid var(--g3);border-radius:var(--radius);padding:0 10px;background:var(--surface)}
.field textarea{height:auto;min-height:84px;padding:8px 10px;resize:vertical;line-height:1.45}
.field .owner-wrap{position:relative}
.field .sugg{position:absolute;inset-inline:0;top:100%;background:var(--surface);border:1px solid var(--g3);border-radius:var(--radius);z-index:5;max-height:220px;overflow:auto;box-shadow:0 8px 20px rgba(0,0,0,.08)}
.field .sugg button{display:block;width:100%;text-align:start;border:0;background:transparent;padding:7px 10px}
.field .sugg button:hover{background:var(--g1)}
.field .sugg .h{font-size:11px;color:var(--g4);padding:6px 10px 2px;text-transform:uppercase;letter-spacing:.06em}
.dsec{margin-top:22px}
.dsec h3{font-size:13px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em;color:var(--g5);font-weight:500}
#app[lang="ar"] .dsec h3{letter-spacing:0;font-size:14px}
.upd{border-inline-start:2px solid var(--g2);padding:4px 12px;margin-bottom:10px}
.upd .by{font-size:12px;color:var(--g5);margin-bottom:2px}
.upd .tx{white-space:pre-wrap}
.compose{display:flex;gap:8px;align-items:flex-end}
.compose textarea{flex:1;min-height:60px;border:1px solid var(--g3);border-radius:var(--radius);padding:8px 10px;background:var(--surface);resize:vertical}
.hist{font-size:12px;color:var(--g5);padding:0;margin:0;list-style:none}
.hist li{padding:4px 0;border-bottom:1px dashed var(--g2);display:flex;gap:10px}
.hist li .w{color:var(--g4);flex:none;width:112px;font-variant-numeric:tabular-nums}
.dfoot{display:flex;gap:8px;align-items:center;padding:12px max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--g2);flex-wrap:wrap}
.dfoot .grow{flex:1}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.confirm span{color:var(--g5)}

/* toast */
.toasts{position:fixed;bottom:max(16px,env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#app[dir="rtl"] .toasts{transform:translateX(50%)}
.toast{background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:var(--radius);font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.toast.err{background:var(--g6)}

@media (prefers-reduced-motion:no-preference){ .drawer{animation:slidein .18s ease-out} @keyframes slidein{from{transform:translateX(12px);opacity:.6}to{transform:none;opacity:1}} #app[dir="rtl"] .drawer{animation-name:slideinr} @keyframes slideinr{from{transform:translateX(-12px);opacity:.6}to{transform:none;opacity:1}} }

@media (max-width:900px){
  .shell{flex-direction:column}
  .rail{width:auto;border-inline-end:0;border-bottom:1px solid var(--g2);display:flex;gap:4px;overflow-x:auto;padding:8px 0;align-items:center}
  .rail h4{display:none}
  .rail .item{width:auto;flex:none;padding:6px 10px;border:1px solid var(--g3);border-radius:999px;color:var(--g6)}
  .rail .item.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .rail .item.on::before{display:none}
  .rail .item.on .cnt,.rail .item.on .cnt b{color:var(--bg)}
  .rail .rsep{display:block;width:1px;height:24px;background:var(--g3);flex:none;margin:0 6px}
  .main{padding-inline-start:0;padding-block:14px 28px}
  .search{width:100%}
  .topbar{flex-wrap:wrap}
  .topbar .grow{display:none}
  .brand .product,.brand .sep{display:none}
  .topbar{padding-block:10px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .vhead h1{font-size:22px}
  .list .li .when{width:84px}
  .mechip .n{display:none}
}

/* ---------- Depth layer (October 2026) ----------
   Shape: the workspace is a desk. Trays (kanban columns, the board rail) sit recessed; work items (tiles, cards, rows) sit raised on them.
   Depth comes from shadow only (the brand book allows no gradients); colour is the charcoal ramp plus the one brand teal. */
:root{
  --radius:10px; --radius-s:7px;
  --sh-rgb:27,25,26;
  --hi:rgba(255,255,255,.75);
  --shadow-1:0 1px 0 rgba(var(--sh-rgb),.03),0 1px 2px rgba(var(--sh-rgb),.06),0 6px 16px -8px rgba(var(--sh-rgb),.14);
  --shadow-2:0 2px 4px rgba(var(--sh-rgb),.05),0 18px 36px -14px rgba(var(--sh-rgb),.28);
  --shadow-in:inset 0 2px 5px rgba(var(--sh-rgb),.07),inset 0 0 0 1px rgba(var(--sh-rgb),.04);
  --lift:none;
  --accent:#056D69; --accent-ink:#FFFFFF; --accent-soft:color-mix(in srgb,#056D69 14%,var(--surface));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --sh-rgb:0,0,0; --hi:rgba(255,255,255,.06); --lift:none;
    --shadow-1:0 1px 0 rgba(0,0,0,.2),0 6px 16px -8px rgba(0,0,0,.6); --shadow-2:0 2px 4px rgba(0,0,0,.3),0 20px 40px -14px rgba(0,0,0,.75); --shadow-in:inset 0 2px 6px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.03) }
}
:root[data-theme="dark"]{ --sh-rgb:0,0,0; --hi:rgba(255,255,255,.06); --lift:none;
  --shadow-1:0 1px 0 rgba(0,0,0,.2),0 6px 16px -8px rgba(0,0,0,.6); --shadow-2:0 2px 4px rgba(0,0,0,.3),0 20px 40px -14px rgba(0,0,0,.75); --shadow-in:inset 0 2px 6px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.03) }

.topbar{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.2) blur(10px);-webkit-backdrop-filter:saturate(1.2) blur(10px);box-shadow:0 1px 0 var(--g2),0 8px 20px -18px rgba(var(--sh-rgb),.4);border-bottom-color:transparent}
.search,.iconbtn,.btn,.toolbar select,.toolbar .toggle,.tabs{border-radius:var(--radius-s)}
.search{box-shadow:var(--shadow-in);border-color:var(--g2)}

/* controls: raised, press down */
.btn,.iconbtn{background:var(--surface);background-image:var(--lift);box-shadow:var(--shadow-1),inset 0 1px 0 var(--hi);border-color:var(--g2);transition:transform .12s ease,box-shadow .12s ease,border-color .12s}
.btn:hover,.iconbtn:hover{box-shadow:var(--shadow-2),inset 0 1px 0 var(--hi);transform:translateY(-1px)}
.btn:active,.iconbtn:active{transform:translateY(1px);box-shadow:var(--shadow-in)}
.btn.primary{background:var(--fg);box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 8px 18px -8px rgba(var(--sh-rgb),.55)}
.btn.primary:hover{opacity:1}
.tabs{box-shadow:var(--shadow-in);background:var(--g1);border-color:transparent}
.tabs button{border-radius:5px;transition:background .15s,box-shadow .15s}
.tabs button.on{box-shadow:0 4px 10px -4px rgba(var(--sh-rgb),.5)}
.toolbar select,.toolbar .toggle{box-shadow:var(--shadow-1);border-color:var(--g2)}

/* rail: a recessed tray, the current board lifted out of it */
.rail .item{border-radius:var(--radius-s);transition:background .15s,box-shadow .15s,transform .15s}
.rail .item.on{background:var(--surface);background-image:var(--lift);box-shadow:var(--shadow-1),inset 0 1px 0 var(--hi)}
.rail .item.on::before{inset-inline-start:0;top:9px;bottom:9px;border-radius:3px}
.rail .item:hover:not(.on){transform:translateX(0);background:var(--g1)}

/* surfaces */
.tscroll,.list,.tl-wrap,.lockpanel,.notice{border-radius:var(--radius);border-color:var(--g2);box-shadow:var(--shadow-1)}
.matrix{border-radius:var(--radius);border-collapse:separate;border-spacing:0;overflow:hidden;box-shadow:var(--shadow-1)}
.matrix th:first-child{border-start-start-radius:var(--radius)}
.matrix tr.row td{transition:background .15s}
.ttable tr.task td{transition:background .15s}
.empty{border-radius:var(--radius);box-shadow:var(--shadow-in);border-color:transparent;background:var(--g1)}

/* 3D tilt (driven by the script: --rx, --ry set on hover) */
.tilt{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px));transform-style:preserve-3d;transition:transform .18s ease,box-shadow .18s ease;will-change:transform}
.tilt > *{position:relative;z-index:1}
.tilt.hot{--ty:-3px;box-shadow:var(--shadow-2),inset 0 1px 0 var(--hi)}

/* overview tiles: raised blocks; the overdue tile is the one solid block, because it is the one that asks for action */
.tiles{gap:14px}
.tile{position:relative;border-radius:var(--radius);border-color:var(--g2);background:var(--surface);background-image:var(--lift);box-shadow:var(--shadow-1),inset 0 1px 0 var(--hi);padding:16px 18px 18px}
.tile .v{font-size:40px;letter-spacing:-.02em;text-shadow:0 1px 0 var(--hi),0 6px 14px rgba(var(--sh-rgb),.12)}
.tile.overdue{background:var(--fg);color:var(--bg);border-color:var(--fg);box-shadow:0 1px 0 rgba(255,255,255,.1) inset,0 16px 30px -14px rgba(var(--sh-rgb),.6)}
.tile.overdue .k{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.tile.overdue .v{text-shadow:0 6px 18px rgba(0,0,0,.35)}
.tile.overdue .v::after{background:var(--bg)}

/* progress bars: a groove with raised segments */
.bar{height:10px;border-radius:999px;background:var(--g1);box-shadow:var(--shadow-in);gap:1px}
.bar i{border-radius:999px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 1px 2px rgba(var(--sh-rgb),.15)}
.bar .b-todo{background-image:none;box-shadow:none}

/* kanban: recessed trays, raised cards */
.col{border-radius:calc(var(--radius) + 4px);background:var(--g1);box-shadow:var(--shadow-in);padding:12px;border-color:transparent}
.col.over{box-shadow:var(--shadow-in),0 0 0 2px var(--fg)}
.card{position:relative;border-radius:var(--radius);border-color:var(--g2);background:var(--surface);background-image:var(--lift);box-shadow:var(--shadow-1),inset 0 1px 0 var(--hi);transition:transform .16s ease,box-shadow .16s ease;margin-bottom:10px}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-2),inset 0 1px 0 var(--hi)}
.card.dragging{transform:rotate(-2deg) scale(1.02);box-shadow:var(--shadow-2)}
.col.c-stuck .card{border-inline-start:3px solid var(--fg)}

/* timeline bars get the same raised finish */
.tl .tbar{border-radius:999px;box-shadow:0 2px 6px -2px rgba(var(--sh-rgb),.35)}
.tl .tbar.s-todo{box-shadow:none;background-image:none}

/* achievements: the count stands in relief; each achievement is a raised plaque */
.ach-hero{position:relative;padding:22px 24px;border-radius:calc(var(--radius) + 4px);background:var(--fg);color:var(--bg);box-shadow:0 1px 0 rgba(255,255,255,.1) inset,0 22px 40px -20px rgba(var(--sh-rgb),.7);margin-bottom:26px;overflow:hidden}
.ach-hero .n{font-size:72px;letter-spacing:-.03em;text-shadow:0 10px 24px rgba(0,0,0,.4)}
.ach-hero .l{color:color-mix(in srgb,var(--bg) 72%,transparent);font-size:16px}
.ach-sec h3{border-bottom:0;padding-bottom:0}
.ach-sec h3 span{font-size:16px}
.ach-sec h3::after{content:"";flex:1;height:1px;align-self:center;background:var(--g2)}
.ach-grid{gap:14px}
.ach-card{position:relative;border-radius:var(--radius);border-color:var(--g2);background:var(--surface);background-image:var(--lift);box-shadow:var(--shadow-1),inset 0 1px 0 var(--hi);padding:16px 18px 14px}
.ach-card::before{content:"";position:absolute;inset-inline-start:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--fg);opacity:.85}
.ach-card .t{font-size:15px}

/* drawer and toasts float above the desk */
.drawer{box-shadow:-24px 0 60px -20px rgba(var(--sh-rgb),.35)}
#app[dir="rtl"] .drawer{box-shadow:24px 0 60px -20px rgba(var(--sh-rgb),.35)}
.scrim{backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.toast{border-radius:var(--radius-s);box-shadow:0 14px 30px -10px rgba(var(--sh-rgb),.6)}

/* ---------- dates ---------- */
function todayISO(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function parseISO(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); if(!y||!m||!d) return null; return new Date(y,m-1,d); }
function toISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function daysBetween(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }
function fmtDate(iso){ const d=parseISO(iso); if(!d) return ''; try{ return new Intl.DateTimeFormat(t('dateFmt'),{day:'numeric',month:'short',year:'numeric'}).format(d);}catch(e){ return iso; } }
function fmtDateTime(ts){ if(!ts) return ''; const d=new Date(ts); try{ return new Intl.DateTimeFormat(t('dateFmt'),{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(d);}catch(e){ return ts; } }
function fmtRel(ts){ if(!ts) return ''; const diff=(Date.now()-new Date(ts).getTime())/1000; try{ const rtf=new Intl.RelativeTimeFormat(t('dateFmt'),{numeric:'auto'}); if(diff<60) return rtf.format(0,'minute'); if(diff<3600) return rtf.format(-Math.round(diff/60),'minute'); if(diff<86400) return rtf.format(-Math.round(diff/3600),'hour'); if(diff<86400*7) return rtf.format(-Math.round(diff/86400),'day'); }catch(e){} return fmtDateTime(ts); }
function dueInfo(task){
  if(!task.due) return {cls:'',text:'',days:null};
  const n = daysBetween(todayISO(), task.due); // positive = in the future
  if(task.status==='done') return {cls:'',text:'',days:n};
  if(n<0) return {cls:'overdue', text:t('overdueBy')(-n), days:n};
  if(n===0) return {cls:'today', text:t('dueToday'), days:0};
  if(n===1) return {cls:'soon', text:t('dueTomorrow'), days:1};
  if(n<=7) return {cls:'soon', text:t('dueIn')(n), days:n};
  return {cls:'',text:'',days:n};
}
const isOverdue = (task)=> task.status!=='done' && !!task.due && task.due < todayISO();

  const p=S.profiles[id]; if(p && p.name) return p.name;

}
function myName(){ return S.me.name || S.members.get(S.me.id)?.name || ''; }
async function resolveProfiles(){
  if(!S.user) return;
  const ids=new Set();
  for(const tk of S.tasks.values()){ if(tk.createdBy) ids.add(tk.createdBy); if(tk.updatedBy) ids.add(tk.updatedBy); if(tk.ownerId) ids.add(tk.ownerId); (tk.history||[]).forEach(h=>h.by&&ids.add(h.by)); (tk.updates||[]).forEach(u=>u.by&&ids.add(u.by)); }
  for(const id of S.members.keys()) ids.add(id);
  if(S.me.id) ids.add(S.me.id);
  if(!ids.size) return;

}

/* ---------- crypto for the committee board ---------- */
const enc8 = new TextEncoder(), dec8 = new TextDecoder();
const b64 = (buf)=> btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = (s)=> Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const rnd = (n)=> crypto.getRandomValues(new Uint8Array(n));
async function kdf(secret, salt){ const km=await crypto.subtle.importKey('raw', enc8.encode(secret.normalize('NFKC')), 'PBKDF2', false, ['deriveKey']); return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:200000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['wrapKey','unwrapKey']); }
async function wrapWith(secret, dataKey){ const salt=rnd(16), iv=rnd(12); const wk=await kdf(secret, salt); const wrapped=await crypto.subtle.wrapKey('raw', dataKey, wk, {name:'AES-GCM', iv}); return {salt:b64(salt), iv:b64(iv), wrapped:b64(wrapped)}; }
async function unwrapWith(secret, w){ const wk=await kdf(secret, unb64(w.salt)); return crypto.subtle.unwrapKey('raw', unb64(w.wrapped), wk, {name:'AES-GCM', iv:unb64(w.iv)}, {name:'AES-GCM', length:256}, true, ['encrypt','decrypt']); }
async function encryptObj(obj, key){ const iv=rnd(12); const ct=await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc8.encode(JSON.stringify(obj))); const out=new Uint8Array(12+ct.byteLength); out.set(iv,0); out.set(new Uint8Array(ct),12); return b64(out); }
async function decryptObj(s, key){ const all=unb64(s); const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:all.slice(0,12)}, key, all.slice(12)); return JSON.parse(dec8.decode(pt)); }
function makeRecoveryCode(){ const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const r=rnd(16); let s=''; for(let i=0;i<16;i++){ s+=a[r[i]%a.length]; if(i%4===3&&i<15) s+='-'; } return 'MRN-'+s; }
async function rememberKey(b){ try{ const raw=await crypto.subtle.exportKey('raw', S.keys[b]); sessionStorage.setItem('marn.ck.'+b, b64(raw)); }catch(e){} }
async function restoreKey(){ for(const b of LOCKED){ try{ const s=sessionStorage.getItem('marn.ck.'+b); if(!s) continue; S.keys[b]=await crypto.subtle.importKey('raw', unb64(s), {name:'AES-GCM', length:256}, true, ['encrypt','decrypt']); }catch(e){ delete S.keys[b]; } } }
function forgetKey(b){ try{ sessionStorage.removeItem('marn.ck.'+b); }catch(e){} }
const ENC_FIELDS = ['title','owner','ref','group','notes','updates','history','focus','decision','sitting','lastChange'];

async function toStored(task){
  const copy={...task}; delete copy.id; delete copy.locked;
  if(!isLocked(task.board)){ delete copy.enc; return copy; }
  const key=keyOf(task.board); if(!key) throw new Error('board-locked');
  const secret={}; for(const f of ENC_FIELDS){ if(copy[f]!==undefined){ secret[f]=copy[f]; delete copy[f]; } }
  copy.enc = await encryptObj(secret, key);
  return copy;
}
async function fromStored(id, data){
  const tk={id, ...data};
  if(tk.enc){
    const key=keyOf(tk.board); if(key){ try{ Object.assign(tk, await decryptObj(tk.enc, key)); delete tk.enc; }catch(e){ tk.locked=true; } }
    else tk.locked=true;
  }
  tk.updates = Array.isArray(tk.updates)? tk.updates: []; tk.history = Array.isArray(tk.history)? tk.history: [];
  if(!STATUSES.includes(tk.status)) tk.status='todo'; if(!PRIORITIES.includes(tk.priority)) tk.priority='med';
  return tk;
}

/* ---------- data: subscriptions ---------- */
let rawDocs = new Map();
async function ingestTasks(snap){
  rawDocs = new Map(); snap.docs.forEach(d=>{ if(d.exists) rawDocs.set(d.id, d.data()); });
  await rebuildTasks();
  S.tasksLoaded=true; S.connecting=false;
  await render();
}
async function rebuildTasks(){
  const out=new Map();
  await Promise.all([...rawDocs.entries()].map(async ([id,data])=>{ out.set(id, await fromStored(id,data)); }));
  S.tasks=out;
}
function subscribeAll(){
  const db=S.db;
  db.collection('tasks').onSnapshot(snap=>{ ingestTasks(snap); }, err=>{ console.warn('tasks', err); S.connecting=false; S.dbMissing = err && err.code==='not_granted'; render(); });
  for(const b of LOCKED) db.doc('settings/'+b).onSnapshot(snap=>{ S.lockSettings[b] = snap.exists? snap.data(): null; S.lockLoaded[b]=true; render(); }, err=>console.warn('settings', err));
  db.collection('members').onSnapshot(snap=>{ S.members=new Map(); snap.docs.forEach(d=>{ if(d.exists) S.members.set(d.id, d.data()); }); render(); }, err=>console.warn('members', err));
}

/* ---------- writes ---------- */
const writeQueues = new Map();
function queued(id, fn){ const prev=writeQueues.get(id)||Promise.resolve(); const next=prev.then(fn, fn); writeQueues.set(id, next.catch(()=>{})); return next; }
function hist(what, extra){ return {at:new Date().toISOString(), by:S.me.id||null, what, ...(extra||{})}; }
async function saveTask(task, histEntry, toastKey){
  const now=new Date().toISOString();
  const tk={...task, updatedAt:now, updatedBy:S.me.id||null};
  if(histEntry){ tk.history=[...(tk.history||[]), histEntry].slice(-40); tk.lastChange=histEntry; }
  if(!tk.createdAt){ tk.createdAt=now; tk.createdBy=S.me.id||null; }
  const id = tk.id || S.db.collection('tasks').doc().id;
  tk.id=id;
  let stored; try{ stored = await toStored(tk); }catch(e){ console.warn(e); toast(t('saveFail'), true); return null; }
  // optimistic local state
  S.tasks.set(id, tk); rawDocs.set(id, stored);
  try{
    await queued(id, ()=> S.db.collection('tasks').doc(id).set(stored));
    if(toastKey) toast(t(toastKey));
  }catch(e){ console.warn(e); toast(t('saveFail'), true); markReadonlyIfRefused(e); }
  return id;
}
async function deleteTask(id){
  S.tasks.delete(id); rawDocs.delete(id);
  try{ await queued(id, ()=> S.db.collection('tasks').doc(id).delete()); toast(t('deleted')); }catch(e){ toast(t('saveFail'), true); markReadonlyIfRefused(e); }
}
function markReadonlyIfRefused(e){ if(e && e.code==='invalid_argument' && S.me.canWrite===null){ S.me.canWrite=false; render(); } }
async function setStatus(id, status){
  const tk=S.tasks.get(id); if(!tk || tk.status===status) return;
  await saveTask({...tk, status}, hist('status',{to:status}));
  render();
}
function canWrite(){ return S.me.canWrite!==false && !!S.db; }
function blankTask(board){ const b0={board, title:'', owner:'', ownerId:null, status:'todo', priority:'med', start:'', due:'', ref:'', group:'', notes:'', updates:[], history:[], focus:'', decision:'', sitting:''}; if(isAch(board)) Object.assign(b0,{status:'done',titleEn:'',dept:'',impact:'',impactEn:''}); return b0; }

/* ---------- committee lock ---------- */
async function doSetPassword(pw, pw2){
  if(pw.length<8){ S.lockUI.err=t('pwShort'); return renderMain(true); }
  if(pw!==pw2){ S.lockUI.err=t('pwMismatch'); return renderMain(true); }
  const dataKey = await crypto.subtle.generateKey({name:'AES-GCM', length:256}, true, ['encrypt','decrypt']);
  const rc = makeRecoveryCode();
  const [wp, wr] = await Promise.all([wrapWith(pw, dataKey), wrapWith(rc, dataKey)]);
  const doc={v:1, pw:wp, rc:wr, setAt:new Date().toISOString(), setBy:S.me.id||null};
  const b=S.board; if(!isLocked(b)) return;
  try{ await S.db.doc('settings/'+b).set(doc); }catch(e){ S.lockUI.err=t('saveFail'); return renderMain(true); }
  S.lockSettings[b]=doc; S.keys[b]=dataKey; await rememberKey(b); S.lockUI={mode:'rc', err:'', rc};
  await rebuildTasks(); renderMain(true);
}
async function doUnlock(pw){
  const b=S.board, st=S.lockSettings[b];
  if(!st){ S.lockUI.err=t('notSetOwner'); return renderMain(true); }
  try{ S.keys[b] = await unwrapWith(pw, st.pw); }catch(e){ delete S.keys[b]; S.lockUI.err=t('wrongPw'); return renderMain(true); }
  await rememberKey(b); S.lockUI={mode:'enter',err:'',rc:null}; await rebuildTasks(); toast(t('unlockedToast')); render();
}
async function doRecover(code){
  const b=S.board, st=S.lockSettings[b]; if(!st) return;
  try{ S.keys[b] = await unwrapWith(code.trim().toUpperCase(), st.rc); }catch(e){ delete S.keys[b]; S.lockUI.err=t('wrongRc'); return renderMain(true); }
  await rememberKey(b); S.lockUI={mode:'change', err:'', rc:null, afterRc:true}; await rebuildTasks(); renderMain(true);
}
async function doChangePassword(cur, nw, nw2){
  if(nw.length<8){ S.lockUI.err=t('pwShort'); return renderMain(true); }
  if(nw!==nw2){ S.lockUI.err=t('pwMismatch'); return renderMain(true); }
  const b=S.board, st=S.lockSettings[b]; if(!st || !keyOf(b)) return;
  if(!S.lockUI.afterRc){ try{ await unwrapWith(cur, st.pw); }catch(e){ S.lockUI.err=t('wrongPw'); return renderMain(true); } }
  const wp = await wrapWith(nw, keyOf(b));
  const doc={...st, pw:wp, changedAt:new Date().toISOString(), changedBy:S.me.id||null};
  try{ await S.db.doc('settings/'+b).set(doc); }catch(e){ S.lockUI.err=t('saveFail'); return renderMain(true); }
  S.lockSettings[b]=doc; S.lockUI={mode:'enter',err:'',rc:null}; toast(t('pwChanged')); render();
}
async function doLock(){ const b=S.board; delete S.keys[b]; forgetKey(b); S.lockUI={mode:'enter',err:'',rc:null}; await rebuildTasks(); toast(t('lockedToast')); if(S.drawer && S.tasks.get(S.drawer.id)?.locked) S.drawer=null; render(); }

/* ---------- filtering and sorting ---------- */
function boardTasks(boardId){ return [...S.tasks.values()].filter(x=>x.board===boardId); }
function applyFilters(list){
  const f=S.filters, q=f.q.trim().toLowerCase();
  return list.filter(x=>{
    if(f.hideDone && x.status==='done') return false;
    if(f.status && x.status!==f.status) return false;
    if(f.priority && x.priority!==f.priority) return false;
    if(f.dept && x.dept!==f.dept) return false;
    if(f.focus && x.focus!==f.focus) return false;
    if(f.owner && (x.owner||'')!==f.owner) return false;
    if(q){ const hay=[x.title,x.titleEn,x.impact,x.impactEn,x.owner,x.ref,x.group,x.notes,x.decision].map(v=>(v||'').toLowerCase()).join(' '); if(!hay.includes(q)) return false; }
    return true;
  });
}
const STATUS_RANK={stuck:0,doing:1,todo:2,done:3}, PRI_RANK={high:0,med:1,low:2};
function sortTasks(list){
  const {by,dir}=S.sort, m=dir==='asc'?1:-1;
  const cmp=(a,b)=>{
    let r=0;
    switch(by){
      case 'title': r=(a.title||'').localeCompare(b.title||'', L()); break;
      case 'owner': r=(a.owner||'').localeCompare(b.owner||'', L()); break;
      case 'status': r=STATUS_RANK[a.status]-STATUS_RANK[b.status]; break;
      case 'priority': r=PRI_RANK[a.priority]-PRI_RANK[b.priority]; break;
      case 'updated': r=(a.updatedAt||'').localeCompare(b.updatedAt||''); break;
      case 'due': default: { const ad=a.due||'9999', bd=b.due||'9999'; r=ad.localeCompare(bd); }
    }
    return r*m;
  };
  const out=[...list].sort(cmp);
  if(by==='due'){ out.sort((a,b)=> (a.status==='done')-(b.status==='done')); }
  return out;
}

function timelineHTML(list){
  const withDates=list.filter(x=>x.due||x.start);
  if(!withDates.length) return `<div class="empty"><b>${esc(t('tlEmpty'))}</b></div>`;
  const today=parseISO(todayISO());
  let min=addDays(today,-7), max=addDays(today,28);
  withDates.forEach(x=>{ const a=parseISO(x.start||x.due), b=parseISO(x.due||x.start); if(a<min) min=addDays(a,-3); if(b>max) max=addDays(b,7); });
  if((max-min)/86400000>240){ min=addDays(today,-30); max=addDays(today,120); }
  const days=[]; for(let d=new Date(min); d<=max; d=addDays(d,1)) days.push(new Date(d));
  const n=days.length, colW=28;
  const rows=sortTasks(withDates).filter(x=>{ const b=parseISO(x.due||x.start); const a=parseISO(x.start||x.due); return b>=min && a<=max; });
  let h=`<div class="tl-wrap"><div class="tl" style="grid-template-columns:240px repeat(${n},${colW}px)">`;
  // month row
  h+=`<div class="corner" style="grid-row:1 / span 2"></div>`;

/* ---------- import (Excel, including monday.com board exports) ---------- */
function xlDate(v){
  if(v===null||v===undefined||v==='') return '';
  if(typeof v==='number' && typeof XLSX!=='undefined'){ const d=XLSX.SSF.parse_date_code(v); if(d) return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`; }
  const s=String(v).trim(); let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return '';
}
const MONTHS={january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12};
function xlStamp(v){
  if(typeof v==='number' && typeof XLSX!=='undefined'){ const d=XLSX.SSF.parse_date_code(v); if(d) return new Date(d.y,d.m-1,d.d,d.H||0,d.M||0,Math.floor(d.S||0)).toISOString(); }
  const s=String(v||'').trim(); const m=s.match(/^(\d{1,2})\/([A-Za-z]+)\/(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?/i);
  if(m){ let h=+m[4]; const ap=(m[7]||'').toUpperCase(); if(ap==='PM'&&h<12) h+=12; if(ap==='AM'&&h===12) h=0; const mo=MONTHS[m[2].toLowerCase()]; if(mo) return new Date(+m[3],mo-1,+m[1],h,+m[5],+(m[6]||0)).toISOString(); }
  const d=new Date(s); return isNaN(d)? new Date().toISOString() : d.toISOString();
}
const nrm=(v)=> String(v??'').trim().toLowerCase();
function mapStatus(v){ const s=nrm(v); if(!s) return 'todo';
  for(const k of STATUSES){ if(nrm(T.en.st[k])===s || nrm(T.ar.st[k])===s || k===s) return k; }
  if(/done|complete|منجز/.test(s)) return 'done'; if(/stuck|block|متعثر/.test(s)) return 'stuck'; if(/working|progress|doing|قيد/.test(s)) return 'doing'; return 'todo'; }
function mapPriority(v){ const s=nrm(v); if(!s) return 'med'; if(/critical|high|urgent|عالي|حرج/.test(s)) return 'high'; if(/low|منخفض/.test(s)) return 'low'; return 'med'; }
function mapBoard(v){ const s=nrm(v); if(!s) return ''; const b=BOARDS.find(b=>[b.id,b.en,b.ar].some(z=>nrm(z)===s)); return b? b.id : ''; }
function mapFocus(v){ const s=nrm(v); if(!s) return ''; const f=FOCUS.find(f=>[f.id,f.en,f.ar].some(z=>nrm(z)===s)); return f? f.id : ''; }
function findMember(name){ const n=nrm(String(name||'').split(',')[0]); if(!n) return null; for(const [id,m] of S.members.entries()){ if(nrm(m.name)===n) return id; } return null; }
function parseWorkbook(wb){
  const sheets=wb.SheetNames.map(n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null,raw:true,blankrows:false}));
  // updates: a sheet whose header holds Item ID and Update Content
  const upd=new Map();
  for(const rows of sheets){
    const hi=rows.findIndex(r=>r && r.some(c=>nrm(c)==='item id') && r.some(c=>nrm(c)==='update content')); if(hi<0) continue;
    const hdr=rows[hi].map(nrm); const ci=(k)=>hdr.indexOf(k);
    const cId=ci('item id'), cUser=ci('user'), cAt=ci('created at'), cTx=ci('update content');
    for(const r of rows.slice(hi+1)){ if(!r) continue; const id=String(r[cId]??'').trim(), tx=String(r[cTx]??'').trim(); if(!id||!tx) continue;
      if(!upd.has(id)) upd.set(id,[]); upd.get(id).push({at:xlStamp(r[cAt]), by:findMember(r[cUser]), name:String(r[cUser]||'').trim(), text:tx.slice(0,2000)}); }
  }
  const tasks=[];
  for(const rows of sheets){
    if(rows.some(r=>r && r.some(c=>nrm(c)==='update content'))) continue;
    let col=null, group='', lastSingle='', sub=null, parent=null;
    for(const r of rows){
      if(!r) continue;
      const cells=r.map(c=> c===null? '' : c); const filled=cells.filter(c=>String(c).trim()!=='').length;
      const first=String(cells[0]??'').trim();
      if(nrm(first)==='name' && cells.some(c=>['owner','status','priority','impact','pillar','department'].includes(nrm(c)))){
        const h=cells.map(nrm); col={name:0, sub:h.indexOf('subitems'), owner:h.indexOf('owner'), pri:h.indexOf('priority'), st:h.indexOf('status'), due:h.findIndex(x=>x==='due date'||x==='date'||x==='due'), start:h.findIndex(x=>x==='start'||x==='start date'), id:h.findIndex(x=>x.startsWith('item id')), notes:h.findIndex(x=>x==='notes'), ref:h.findIndex(x=>x==='ref'||x==='reference'), titleEn:h.indexOf('name (english)'), dept:h.indexOf('department'), pillar:h.indexOf('pillar'), impact:h.indexOf('impact'), impactEn:h.indexOf('impact (english)')};
        group=lastSingle; sub=null; continue; }
      if(nrm(first)==='subitems' && cells.some(c=>nrm(c)==='name')){ const h=cells.map(nrm); sub={name:h.indexOf('name'), owner:h.indexOf('owner'), st:h.indexOf('status'), date:h.indexOf('date')}; continue; }
      if(!first){ if(sub && parent){ const nm=String(cells[sub.name]||'').trim(); if(nm){ const bits=[sub.st>=0&&cells[sub.st]?String(cells[sub.st]):'', sub.owner>=0&&cells[sub.owner]?String(cells[sub.owner]):'', sub.date>=0?xlDate(cells[sub.date]):''].filter(Boolean); parent.subs.push('• '+nm+(bits.length?` (${bits.join(', ')})`:'')); } } continue; }
      sub=null;
      if(filled===1){ lastSingle=first; continue; }
      if(!col) continue;
      const g=(i)=> i>=0? cells[i] : '';
      const srcId=String(g(col.id)||'').trim();
      parent={title:first.slice(0,200), owner:String(g(col.owner)||'').trim().slice(0,80), status:mapStatus(g(col.st)), priority:mapPriority(g(col.pri)), critical:/critical/i.test(String(g(col.pri)||'')),
        due:xlDate(g(col.due)), start:xlDate(g(col.start)), group:group.slice(0,60), ref:String(g(col.ref)||'').trim().slice(0,80), notes:String(g(col.notes)||'').trim(), srcId, subs:[], titleEn:String(g(col.titleEn)||'').trim().slice(0,200), dept:mapBoard(g(col.dept)), focus:mapFocus(g(col.pillar)), impact:String(g(col.impact)||'').trim().slice(0,1000), impactEn:String(g(col.impactEn)||'').trim().slice(0,1000)};
      tasks.push(parent);
    }
  }
  return {tasks, upd};
}
async function importFile(file){
  const board=S.board;
  if(S.view!=='board' || !board || (isLocked(board) && !keyOf(board))) return;
  if(typeof XLSX==='undefined'){ toast(t('importFail'), true); return; }
  let parsed;
  try{ const wb=XLSX.read(await file.arrayBuffer(), {type:'array'}); parsed=parseWorkbook(wb); }catch(e){ console.warn(e); toast(t('importFail'), true); return; }
  if(!parsed.tasks.length){ toast(t('importFail'), true); return; }
  toast(t('importing'));
  if(isAch(board)) parsed.tasks.forEach(p=>{ if(!p.srcId) p.srcId='T:'+nrm(p.titleEn||p.title); });
  const have=new Set(boardTasks(board).map(x=>x.srcId || (isAch(board)? 'T:'+nrm(x.titleEn||x.title) : '')).filter(Boolean));
  let n=0, k=0;
  for(const p of parsed.tasks){
    if(p.srcId && have.has(p.srcId)){ k++; continue; }
    const notes=[p.notes, p.critical? (L()==='ar'?'الأولوية في المصدر: حرجة':'Source priority: Critical') : '', p.subs.length? ((L()==='ar'?'المهام الفرعية:':'Subitems:')+'\n'+p.subs.join('\n')) : ''].filter(Boolean).join('\n\n').slice(0,4000);
    const updates=(parsed.upd.get(p.srcId)||[]).sort((a,b)=>a.at.localeCompare(b.at)).slice(-100);
    const tk={...blankTask(board), title:p.title, owner:p.owner, ownerId:findMember(p.owner), status:p.status, priority:p.priority, start:p.start, due:p.due, group:p.group, ref:p.ref, notes, updates};
    if(p.srcId) tk.srcId=p.srcId;
    if(p.focus) tk.focus=p.focus;
    if(isAch(board)) Object.assign(tk,{status:'done', owner:'', ownerId:null, due:'', start:'', titleEn:p.titleEn, dept:p.dept, impact:p.impact, impactEn:p.impactEn});
    const id=await saveTask(tk, hist('created')); if(id){ n++; if(p.srcId) have.add(p.srcId); }
  }
  toast(t('imported')(n,k)); render();
}

/* ---------- toast ---------- */
function toast(msg, err){ const host=$('#toasts'); const el=document.createElement('div'); el.className='toast'+(err?' err':''); el.textContent=msg; host.appendChild(el); setTimeout(()=>el.remove(), 2600); }

/* ---------- master render ---------- */
let rendering=false, renderAgain=false;
async function render(){
  if(rendering){ renderAgain=true; return; }
  rendering=true;
  try{ await resolveProfiles(); renderChrome(); renderRail(); renderMain(); if(S.drawer && S.drawer.mode==='edit'){ const cur=S.tasks.get(S.drawer.id); if(!cur){ S.drawer=null; renderDrawer(); } else if(!document.activeElement || !$('#drawerhost')?.contains(document.activeElement)){ S.drawer.draft={...cur}; renderDrawer(); } } }
  finally{ rendering=false; if(renderAgain){ renderAgain=false; render(); } }
}
function nav(target){
  S.drawer=null; renderDrawer();
  if(target.startsWith('board:')){ S.view='board'; S.board=target.slice(6); S.filters={q:'',status:'',owner:'',priority:'',hideDone:false,dept:'',focus:''}; $('#q').value=''; }
  else { S.view=target; S.board=null; }
  try{ history.replaceState(null,'', '#'+(S.view==='board'?S.board:S.view)); }catch(e){}
  render(); $('#main').scrollTop=0;
}

/* ---------- events ---------- */
document.addEventListener('click', async (ev)=>{
  const el=ev.target.closest('[data-action]'); if(!el) return;
  const a=el.dataset.action;
  if(a==='nav'){ nav(el.dataset.nav); }
  else if(a==='bview'){ S.boardView=el.dataset.v; try{ localStorage.setItem('marn.bview', S.boardView);}catch(e){} S.mainKey=''; render(); }
  else if(a==='open'){ ev.stopPropagation(); openTask(el.dataset.id); }
  else if(a==='new'){ newTask(); }
  else if(a==='close'){ closeDrawer(); }
  else if(a==='sort'){ const by=el.dataset.by; if(S.sort.by===by) S.sort.dir=S.sort.dir==='asc'?'desc':'asc'; else S.sort={by,dir:'asc'}; renderBody(); }
  else if(a==='export'){ exportXlsx(); }
  else if(a==='import'){ $('#importfile')?.click(); }
  else if(a==='signout'){ if(window.__marnSignOut) window.__marnSignOut(); }
  else if(a==='lock'){ doLock(); }
  else if(a==='changepw'){ S.lockUI={mode:'change',err:'',rc:null}; renderMain(true); }
  else if(a==='lock-cancel'){ S.lockUI={mode:'enter',err:'',rc:null}; S.mainKey=''; render(); }
  else if(a==='lock-recover'){ S.lockUI={mode:'recover',err:'',rc:null}; renderMain(true); }
  else if(a==='rc-done'){ S.lockUI={mode:'enter',err:'',rc:null}; S.mainKey=''; toast(t('unlockedToast')); render(); }
  else if(a==='create'){
    const d=S.drawer; if(!d) return; const x=d.draft; x.title=(x.title||'').trim(); if(!x.title){ $('#f-title')?.focus(); return; }
    const id=await saveTask({...x}, hist('created'), 'saved'); S.drawer=null; renderDrawer(); render();
  }
  else if(a==='post'){
    const d=S.drawer; const ta=$('#f-update'); const text=(ta?.value||'').trim(); if(!d||!text) return;
    const cur=S.tasks.get(d.id); if(!cur) return;
    const next={...cur, updates:[...cur.updates, {at:new Date().toISOString(), by:S.me.id||null, text}].slice(-100)};
    await saveTask(next, hist('update')); S.drawer.draft={...S.tasks.get(d.id)}; renderDrawer(); render();
  }
  else if(a==='delete-ask'){ S.drawer.confirm=true; renderDrawer(); }
  else if(a==='delete-no'){ S.drawer.confirm=false; renderDrawer(); }
  else if(a==='delete-yes'){ const id=S.drawer.id; S.drawer=null; renderDrawer(); await deleteTask(id); render(); }
  else if(a==='pick-owner'){ const d=S.drawer; if(!d) return; d.draft.owner=el.dataset.name; d.draft.ownerId=el.dataset.id||null; $('#f-owner').value=el.dataset.name; $('#sugg').hidden=true; if(d.mode==='edit'){ const cur=S.tasks.get(d.id); await saveTask({...cur, owner:d.draft.owner, ownerId:d.draft.ownerId}, hist('field',{field:'owner'})); render(); } }
  else if(a==='save-name'){
    const name=($('#id-name')?.value||'').trim(), position=($('#id-pos')?.value||'').trim(); if(!name||!S.me.id) return;
    const prev=S.members.get(S.me.id)||{}; const rec={...prev, name, position, updatedAt:new Date().toISOString()};
    try{ await S.db.doc('members/'+S.me.id).set(rec); S.members.set(S.me.id,rec); toast(t('saved')); }catch(e){ toast(t('saveFail'), true); }
    render();
  }
});
document.addEventListener('submit', async (ev)=>{
  const f=ev.target.closest('form[data-action]'); if(!f) return; ev.preventDefault();
  const a=f.dataset.action; S.lockUI.err='';
  if(a==='setpw') await doSetPassword($('#pw1').value, $('#pw2').value);
  else if(a==='unlock') await doUnlock($('#pwin').value);
  else if(a==='recover') await doRecover($('#rcin').value);
  else if(a==='changepw-submit') await doChangePassword($('#pwc')?.value||'', $('#pwn').value, $('#pwn2').value);
});
document.addEventListener('change', async (ev)=>{
  const el=ev.target;
  if(el.id==='importfile'){ const f=el.files&&el.files[0]; el.value=''; if(f) await importFile(f); return; }
  if(el.dataset.action==='status'){ await setStatus(el.dataset.id, el.value); return; }
  if(el.dataset.action==='filter'){ const f=el.dataset.f; S.filters[f]= f==='hideDone'? el.checked : el.value; renderBody(); return; }
  if(el.closest('#drawerhost') && el.dataset.f){ const f=el.dataset.f; const v = el.value; if(f==='board' && S.drawer?.mode==='new'){ S.drawer.draft.board=v; renderDrawer(); return; } await commitDraftField(f, v); if(f==='board'||f==='status') renderDrawer(); }
});
document.addEventListener('input', (ev)=>{
  const el=ev.target;
  if(el.id==='q'){ S.filters.q=el.value; if(S.view==='board'||S.view==='mine'||S.view==='overdue'){ renderBody(); } else if(S.view==='search'){ if(!el.value){ S.view=S.prevView||'overview'; S.mainKey=''; render(); } else { S.mainKey=''; renderMain(); } } else if(el.value){ S.prevView=S.view; S.view='search'; S.drawer=null; renderDrawer(); S.mainKey=''; render(); } return; }
  if(el.id==='f-owner'){ const s=$('#sugg'); const h=ownerSuggestions(el.value); s.innerHTML=h; s.hidden=!h; if(S.drawer) { S.drawer.draft.owner=el.value; S.drawer.draft.ownerId=null; } return; }
  if(el.closest('#drawerhost') && el.dataset.f && S.drawer){ S.drawer.draft[el.dataset.f]=el.value; }
});
document.addEventListener('focusin', (ev)=>{ if(ev.target.id==='f-owner'){ const s=$('#sugg'); const h=ownerSuggestions(ev.target.value); s.innerHTML=h; s.hidden=!h; } });
document.addEventListener('focusout', (ev)=>{ if(ev.target.id==='f-owner'){ setTimeout(()=>{ const s=$('#sugg'); if(s && !s.contains(document.activeElement)) s.hidden=true; }, 150); } });
document.addEventListener('keydown', (ev)=>{ if(ev.key==='Escape' && S.drawer){ closeDrawer(); } });
$('#langbtn').addEventListener('click', ()=> setLang(L()==='ar'?'en':'ar'));
// drag and drop on the kanban
document.addEventListener('dragstart', (ev)=>{ const c=ev.target.closest('.card'); if(!c||c.getAttribute('draggable')!=='true') return; ev.dataTransfer.setData('text/plain', c.dataset.id); ev.dataTransfer.effectAllowed='move'; c.classList.add('dragging'); });
document.addEventListener('dragend', (ev)=>{ document.querySelectorAll('.card.dragging').forEach(c=>c.classList.remove('dragging')); document.querySelectorAll('.col.over').forEach(c=>c.classList.remove('over')); });
document.addEventListener('dragover', (ev)=>{ const col=ev.target.closest('.col'); if(!col) return; ev.preventDefault(); ev.dataTransfer.dropEffect='move'; document.querySelectorAll('.col.over').forEach(c=>c!==col&&c.classList.remove('over')); col.classList.add('over'); });
document.addEventListener('dragleave', (ev)=>{ const col=ev.target.closest('.col'); if(col && !col.contains(ev.relatedTarget)) col.classList.remove('over'); });
document.addEventListener('drop', async (ev)=>{ const col=ev.target.closest('.col'); if(!col) return; ev.preventDefault(); col.classList.remove('over'); const id=ev.dataTransfer.getData('text/plain'); if(id) await setStatus(id, col.dataset.status); });

/* ---------- boot ---------- */
async function boot(){
  try{ const l=localStorage.getItem('marn.lang'); if(l==='en'||l==='ar') S.lang=l; }catch(e){}
  try{ const v=localStorage.getItem('marn.bview'); if(['table','kanban','timeline'].includes(v)) S.boardView=v; }catch(e){}
  const hash=(location.hash||'').replace('#','');
  if(['overview','mine','overdue','activity'].includes(hash)) S.view=hash; else if(BOARDS.some(b=>b.id===hash)){ S.view='board'; S.board=hash; }
  setLang(S.lang);
  await restoreKey();
  const caps = window.__marnCapsPromise ? await window.__marnCapsPromise : (window.__marnCaps || null);
  const use = (name)=> caps? Promise.resolve(caps[name]||null) : (window.claude && window.claude.use ? window.claude.use(name) : Promise.resolve(null));
  const [db, user, downloads] = await Promise.all([use('db'), use('user'), use('downloads')]);
  S.db=db; S.user=user; S.downloads=downloads;
  if(user){ try{ const me=await user.me(); S.me={id:me.id, name:me.name||'', avatarUrl:me.avatarUrl||'', isOwner:!!me.isOwner, canEdit:!!me.canEdit, canWrite: await user.can('data.write')}; }catch(e){} }
  if(!db){ S.connecting=false; render(); return; }
  subscribeAll();
  setTimeout(()=>{ if(!S.tasksLoaded){ S.connecting=false; render(); } }, 12000);
  render();
}
boot();
})();
</script>

<script>
/* 3D tilt for tiles and achievement plaques: follows the pointer, gently; off for touch and reduced motion */
(function(){
  var fine = window.matchMedia && matchMedia('(hover:hover) and (pointer:fine)').matches;
  var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!fine || calm) return;
  var SEL = '.tile, .ach-card', cur = null, raf = 0, last = null;
  function reset(el){ el.classList.remove('hot'); el.style.removeProperty('--rx'); el.style.removeProperty('--ry'); }
  document.addEventListener('pointerover', function(e){ var el = e.target.closest && e.target.closest(SEL); if(el && !el.classList.contains('tilt')) el.classList.add('tilt'); });
  document.addEventListener('pointermove', function(e){
    var el = e.target.closest && e.target.closest(SEL);
    if(cur && cur !== el) reset(cur);
    cur = el; if(!el) return; last = e;
    if(raf) return;
    raf = requestAnimationFrame(function(){
      raf = 0; if(!cur || !last) return;
      var r = cur.getBoundingClientRect(), x = (last.clientX - r.left) / r.width, y = (last.clientY - r.top) / r.height;
      var max = cur.classList.contains('tile') ? 6 : 4;
      cur.classList.add('tilt','hot');
      cur.style.setProperty('--ry', ((x - .5) * max * 2).toFixed(2) + 'deg');
      cur.style.setProperty('--rx', ((.5 - y) * max * 2).toFixed(2) + 'deg');
      cur.style.setProperty('--mx', (x * 100).toFixed(1) + '%');
      cur.style.setProperty('--my', (y * 100).toFixed(1) + '%');
    });
  }, {passive:true});
  document.addEventListener('pointerleave', function(){ if(cur){ reset(cur); cur = null; } }, true);
  window.addEventListener('blur', function(){ if(cur){ reset(cur); cur = null; } });
})();
</script>
